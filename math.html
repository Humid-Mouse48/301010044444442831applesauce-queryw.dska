      --secondary-color: #00ff99;

      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 0.15);

    body {

      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;

    body.game-active {
      overflow: hidden;
      padding: 0 !important;

    .side-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);

      z-index: 10001;

      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .side-menu-overlay.active {

      padding: 0 20px;

      <img class="card-bg-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9iLwTwJoZQG86IiAt2Po7fA-wUVdt860HWzu1-xoQJQ&s=10" alt="">
      <div class="card-content">
        <span class="card-title">Yandere Simulator</span>
      </div>
    </button>
  </main>

  <div id="no-results" class="no-results-msg">
    <p>No games match your search. Try another keyword!</p>
  </div>

  <section id="game-screen-wrapper" class="full-screen-wrapper">
    <div id="game-controls" class="corner-top-right">
      <button id="close-game-btn" class="close-game-btn" style="position: static;" onclick="closeGame()">✕ Close</button>
      <button id="fullscreen-game-btn" class="close-game-btn" style="position: static; font-size: 1.2rem; padding: 10px 12px;" onclick="toggleFullScreenGame()">⛶</button>
    </div>
    <div id="game-frame-container" style="width: 100%; height: 100%;"></div>
  </section>

  <script>
    let activeCategory = 'All';

    function toggleMenu() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      menu.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function openSettings() {
      toggleMenu();
      document.getElementById('settingsOverlay').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').style.display = 'none';
    }

    function closeSettingsOnOverlay(e) {
      if (e.target.id === 'settingsOverlay') {
        closeSettings();
      }
    }

    function openSuggestions() {
      toggleMenu();
      document.getElementById('suggestionsOverlay').style.display = 'flex';
    }

    function closeSuggestions() {
      document.getElementById('suggestionsOverlay').style.display = 'none';
    }

    function closeSuggestionsOnOverlay(e) {
      if (e.target.id === 'suggestionsOverlay') {
        closeSuggestions();
      }
    }

    function closeAnnouncement() {
      document.getElementById('announcementOverlay').style.display = 'none';
    }

    function closeAnnouncementOnOverlay(e) {
      if (e.target.id === 'announcementOverlay') {
        closeAnnouncement();
      }
    }

    const CONTROL_CORNERS = ['top-left', 'top-middle', 'top-right', 'bottom-left', 'bottom-middle', 'bottom-right'];
    const CONTROLS_CORNER_KEY = 'geekedControlsCorner';

    function setGameControlsCorner(corner, persist) {
      if (persist === undefined) persist = true;

      const controls = document.getElementById('game-controls');
      const select = document.getElementById('controls-corner-input');

      if (!CONTROL_CORNERS.includes(corner)) {
        corner = 'top-right';
      }

      CONTROL_CORNERS.forEach(c => controls.classList.remove('corner-' + c));
      controls.classList.add('corner-' + corner);

      if (select) select.value = corner;

      if (persist) {
        try { localStorage.setItem(CONTROLS_CORNER_KEY, corner); } catch (err) {}
      }
    }

    function loadGameControlsCorner() {
      let savedCorner = 'top-right';
      try {
        savedCorner = localStorage.getItem(CONTROLS_CORNER_KEY) || 'top-right';
      } catch (err) {
        savedCorner = 'top-right';
      }
      setGameControlsCorner(savedCorner, false);
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      const triggerKey = (document.getElementById('panic-key-input').value || "'").toLowerCase();
      let targetUrl = document.getElementById('panic-url-input').value || 'https://google.com';

      if (e.key.toLowerCase() === triggerKey) {
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          targetUrl = 'https://' + targetUrl;
        }
        window.open(targetUrl, '_blank');
      }
    });

    function getGameCategory(title) {
      const t = title.toLowerCase();
      
      if (t.includes("baldi") || t.includes("eaglercraft")) {
        return 'Arcade';
      }

      if (t.includes("bloodmoney")) {
        return 'Horror';
      }
      
        if (t.includes("fnaf world")) {
        return 'RPG';
      }

      if (t.includes("among us")) {
        return 'Strategy';
      }

      if (t.includes('bloxorz') || t.includes('red ball')) {
        return 'Puzzle';
      }

      if (t.includes('bloxorz') || t.includes('terraria')) {
        return 'Sandbox';
   
      }

      if (t.includes('funkin') || t.includes('geometry dash') || t.includes('osu')) return 'Rhythm';
      if (t.includes('five nights') || t.includes('fnaf') || t.includes('doki doki')) return 'Horror';
      if (t.includes('bloons') || t.includes('vikings') || t.includes('bloxorz')) return 'Strategy';
      if (t.includes('drift') || t.includes('drive')) return 'Driving';
      if (t.includes('fortzone') || t.includes('shooter')) return 'Action';
      if (t.includes('fortzone') || t.includes('ragdoll')) return 'Action';
      if (t.includes('yandere simulator') || t.includes('yandere')) return 'Horror';
      if (t.includes('simulator') || t.includes('bitlife')) return 'Simulation';
      if (t.includes('google') || t.includes('doodle') || t.includes('angry birds')) return 'Arcade';
      if (t.includes('solar smash') || t.includes('duck life') || t.includes('simulator')) return 'Simulation';
      if (t.includes('snow rider 3d') || t.includes('race') || t.includes('escape road')) return 'Driving';
      if (t.includes('duel') || t.includes('vikings') || t.includes('clash of')) return 'Strategy';
      if (t.includes('boom slingers') || t.includes('vikings') || t.includes('boom')) return 'Strategy';
      if (t.includes('boom slingers') || t.includes('vikings') || t.includes('bloxorz')) return 'Puzzle';
      if (t.includes('ultrakill') || t.includes('shooter')) return 'Action';
      if (t.includes('3dash') || t.includes('geometry dash') || t.includes('fnf')) return 'Rhythm';
      if (t.includes('g-switch 3') || t.includes('doodle') || t.includes('angry birds')) return 'Arcade';
      if (t.includes('fireboy') || t.includes('doodle') || t.includes('angry birds')) return 'Puzzle';
      if (t.includes('moto x3m') || t.includes('doodle') || t.includes('bergentruck201x')) return 'Driving';
      if (t.includes('hardest game') || t.includes('google') || t.includes('angry birds')) return 'Arcade';
      if (t.includes('sonic') || t.includes('google') || t.includes('angry birds')) return 'Arcade';
      if (t.includes('stick war') || t.includes('vikings') || t.includes('boom')) return 'Strategy';
      if (t.includes('ultimate custom night') || t.includes('fnaf') || t.includes('doki doki')) return 'Horror';
      if (t.includes('minecraft') || t.includes('fnaf') || t.includes('doki doki')) return 'Sandbox';
 if (t.includes('gun') || t.includes('fnaf') || t.includes('doki doki')) return 'Action';
 if (t.includes('boss slayer') || t.includes('vikings') || t.includes('boom')) return 'Strategy';
     if (t.includes('cloverpit') || t.includes('fnaf') || t.includes('doki doki')) return 'Horror';
      if (t.includes('1 date danger') || t.includes('fnaf') || t.includes('doki doki')) return 'Simulation';
       if (t.includes('moto x3m') || t.includes('doodle') || t.includes('rider')) return 'Driving';
        if (t.includes('undertale') || t.includes('deltarune') || t.includes('rider')) return 'RPG';
         if (t.includes('cuphead') || t.includes('fnaf world') || t.includes('rider')) return 'RPG';
         if (t.includes('bfdia 5b') || t.includes('vikings') || t.includes('bloxorz')) return 'Puzzle';
      if (t.includes('speed stars') || t.includes('noomiclone') || t.includes('boom')) return 'Strategy';
      if (t.includes('brawl') || t.includes('noomiclone') || t.includes('boom')) return 'Action';
    return 'Casual';
    }

    function generateCategories() {
      const cards = document.getElementsByClassName('game-card');
      const categoriesSet = new Set(['All']);

      for (let i = 0; i < cards.length; i++) {
        const title = cards[i].querySelector('.card-title').innerText;
        const category = getGameCategory(title);
        cards[i].setAttribute('data-category', category);
        categoriesSet.add(category);
      }

      const wrapper = document.getElementById('categories-wrapper');
      wrapper.innerHTML = '';

      const orderedCategories = Array.from(categoriesSet).sort((a, b) => {
        if (a === 'All') return -1;
        if (b === 'All') return 1;
        return a.localeCompare(b);
      });

      orderedCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'category-chip' + (cat === 'All' ? ' active' : '');
        btn.innerText = cat;
        btn.onclick = () => filterByCategory(cat, btn);
        wrapper.appendChild(btn);
      });
    }

    function filterByCategory(category, clickedBtn) {
      activeCategory = category;
      
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(c => c.classList.remove('active'));
      clickedBtn.classList.add('active');

      filterGames();
    }

    function filterGames() {
      const searchInput = document.getElementById('game-search');
      const filter = searchInput.value.toLowerCase();
      const cards = document.getElementsByClassName('game-card');
      const clearBtn = document.getElementById('clear-search');
      let matchCount = 0;

      clearBtn.style.display = filter.length > 0 ? 'flex' : 'none';

      for (let i = 0; i < cards.length; i++) {
        const title = cards[i].querySelector('.card-title').innerText;
        const cardCategory = cards[i].getAttribute('data-category');

        const matchesSearch = title.toLowerCase().indexOf(filter) > -1;
        const matchesCategory = (activeCategory === 'All') || (cardCategory === activeCategory);

        if (matchesSearch && matchesCategory) {
          cards[i].style.display = "flex";
          matchCount++;
        } else {
          cards[i].style.display = "none";
        }
      }

      document.getElementById('no-results').style.display = matchCount === 0 ? 'block' : 'none';
    }

    function clearSearch() {
      const searchInput = document.getElementById('game-search');
      searchInput.value = '';
      filterGames();
      searchInput.focus();
    }

    function loadGame(url) {
      if (!url) return;
      document.getElementById('game-frame-container').innerHTML = `<iframe src="${url}" allow="xr-spatial-tracking; fullscreen; accelerometer; gyroscope" style="width:100%; height:100%; border:none;" title="Active Game Frame"></iframe>`;
      document.getElementById('game-screen-wrapper').style.display = 'block';
      document.body.classList.add('game-active');
    }

    function closeGame() {
      document.getElementById('game-frame-container').innerHTML = '';
      document.getElementById('game-screen-wrapper').style.display = 'none';
      document.body.classList.remove('game-active');
    }

    function launchGeekedCloaker() {
      toggleMenu();

      const originalTitle = document.title;
      const originalFaviconNode = document.querySelector("link[rel*='icon']");
      let originalFaviconHref = originalFaviconNode ? originalFaviconNode.href : "";

      if (originalFaviconHref && !originalFaviconHref.startsWith('http') && !originalFaviconHref.startsWith('data:')) {
        const tempAnchor = document.createElement('a');
        tempAnchor.href = originalFaviconHref;
        originalFaviconHref = tempAnchor.href;
      }

      const cleanWindow = window.open('about:blank', '_blank');
      
      if (!cleanWindow) {
        alert("Popup blocker active! Please allow popups to open the cloaked site.");
        return;
      }

      let rawCodeString = document.documentElement.outerHTML;

      cleanWindow.document.body.style.margin = '0';
      cleanWindow.document.body.style.padding = '0';
      cleanWindow.document.body.style.overflow = 'hidden';
      cleanWindow.document.body.style.backgroundColor = '#121212';

      cleanWindow.document.title = originalTitle;
      if (originalFaviconHref) {
        const targetFavicon = cleanWindow.document.createElement('link');
        targetFavicon.rel = 'icon';
        targetFavicon.type = originalFaviconNode.type || 'image/x-icon';
        targetFavicon.href = originalFaviconHref;
        cleanWindow.document.head.appendChild(targetFavicon);
      }

      const frameContainer = cleanWindow.document.createElement('iframe');
      frameContainer.style.position = 'fixed';
      frameContainer.style.top = '0';
      frameContainer.style.left = '0';
      frameContainer.style.width = '100vw';
      frameContainer.style.height = '100vh';
      frameContainer.style.border = 'none';

      const scriptFreeBlob = new Blob([rawCodeString], { type: 'text/html;charset=utf-8' });
      frameContainer.src = URL.createObjectURL(scriptFreeBlob);

      cleanWindow.document.body.appendChild(frameContainer);
    }

    window.addEventListener('DOMContentLoaded', () => {
      generateCategories();
      loadGameControlsCorner();
    });

    function toggleFullScreenGame() {
      const gameWrapper = document.getElementById('game-screen-wrapper');

      if (!document.fullscreenElement) {
        if (gameWrapper.requestFullscreen) {
          gameWrapper.requestFullscreen();
        } else if (gameWrapper.webkitRequestFullscreen) {
          gameWrapper.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

    function handleFullscreenChange() {
      const gameControls = document.getElementById('game-controls');

      if (document.fullscreenElement || document.webkitFullscreenElement) {
        gameControls.style.display = "none";
      } else {
        gameControls.style.display = "flex";
      }
    }
  </script>

<script>
  document.querySelectorAll('iframe').forEach(iframe => {
    const currentPath = iframe.getAttribute('src');
    if (currentPath && !currentPath.startsWith('http://') && !currentPath.startsWith('https://')) {
      const cleanPath = currentPath.startsWith('/') ? currentPath : '/' + currentPath;
      iframe.src = window.location.origin + cleanPath;
    }
  });
</script>

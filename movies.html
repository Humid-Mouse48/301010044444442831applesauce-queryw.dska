<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geeked Movies</title>
<style>
  :root {
    --primary-color: #261a11; 
    --secondary-color: #c18a59; 
    --bg-dark: #100b07;
    --text-main: #fff5e9; 
    --text-muted: #c5a487;
    --radius-card: 12px; 
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(var(--season-accent-rgb, 193,138,89),.09), transparent 28%),
      radial-gradient(circle at 88% 18%, rgba(218,190,160,.045), transparent 30%),
      var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
  }

  header {
    position: sticky;
    top: 75px; /* Positioned much further down the page */
    z-index: 50;
    display: flex;
    justify-content: center;
    padding: 0 16px;
    pointer-events: none;
  }

  .nav-controls {
    pointer-events: auto;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px 16px;
    background: var(--nav-bg, linear-gradient(135deg, #342317, #261a11));
    border: 1px solid var(--season-accent-border, rgba(193,138,89,0.38)) !important;
    border-radius: 9999px;
    backdrop-filter: blur(26px) saturate(155%);
    -webkit-backdrop-filter: blur(26px) saturate(155%);
    box-shadow: 0 12px 38px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .nav-controls:hover {
    box-shadow: 0 12px 30px var(--season-accent-soft, rgba(170,112,62,0.18));
    border-color: var(--season-accent, rgba(193,138,89,0.6)) !important;
  }

  input, select, button {
    padding: 8px 14px;
    border-radius: 9999px;
    border: 1px solid var(--season-accent-border, rgba(218,190,160,0.2));
    background: var(--nav-bg, linear-gradient(135deg, #342317, #261a11));
    color: var(--text-main);
    font-size: 13px;
    transition: var(--transition);
  }

  /* Search bar: non-glowing outline by default, glowing on hover/focus */
  #q {
    width: 180px;
    border: 1px solid var(--season-accent-border, rgba(218,190,160,0.2)) !important;
    box-shadow: none !important;
  }

  #q:hover {
    border-color: var(--season-accent, rgba(193,138,89,0.5)) !important;
    box-shadow: none !important;
  }

  #q:focus, #q:focus-visible {
    outline: none !important;
    border-color: var(--season-accent, #c18a59) !important;
    box-shadow: 0 0 15px var(--season-accent-soft, rgba(193,138,89,0.3)) !important;
    width: 240px;
  }

  select {
    cursor: pointer;
    color-scheme: dark;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c5a487' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 14px;
    padding-right: 32px;
  }

  select option {
    background-color: var(--bg-dark);
    color: var(--text-main);
  }

  button {
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    border-color: var(--season-accent, rgba(193,138,89,0.6));
    color: var(--secondary-color);
  }

  #hero {
    position: relative;
    height: 65vh;
    min-height: 400px;
    background-size: cover;
    background-position: center 20%;
    display: flex;
    align-items: flex-end;
    padding: 0 4% 40px;
    margin-top: 0px;
  }

  #hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(0deg, var(--bg-dark) 0%, rgba(16,11,7,0.52) 42%, rgba(16,11,7,0.16) 100%),
      linear-gradient(90deg, var(--bg-dark) 0%, rgba(16,11,7,0.36) 52%, transparent 100%);
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 600px;
    background: var(--panel-bg, linear-gradient(135deg, #342317, #261a11 58%, #100b07));
    border: 1px solid var(--season-accent-border, rgba(193,138,89,0.38));
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 18px 52px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.07);
  }

  .hero-title {
    font-size: 2.4rem;
    font-weight: 800;
    margin: 0 0 10px 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .hero-meta {
    color: var(--secondary-color);
    font-size: 0.95rem;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .hero-desc {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 20px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .hero-btn {
    background: var(--nav-bg, linear-gradient(135deg, #342317, #261a11));
    color: var(--text-main);
    font-weight: 700;
    padding: 12px 28px;
    font-size: 1rem;
    border: 1px solid var(--season-accent-border, rgba(193,138,89,0.38));
    border-radius: var(--radius-card);
    box-shadow: 0 16px 48px rgba(0,0,0,0.28);
  }

  .hero-btn:hover {
    border-color: var(--season-accent, rgba(193,138,89,0.6));
    color: var(--secondary-color);
    box-shadow: 0 8px 25px var(--season-accent-soft, rgba(170,112,62,0.18));
    transform: scale(1.03);
  }

  .section-title {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 30px 4% 16px;
    color: var(--text-main);
    letter-spacing: 0.5px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    padding: 0 4% 40px;
  }

  .card {
    position: relative;
    cursor: pointer;
    background: var(--card-bg, #21170f);
    border-radius: var(--radius-card);
    overflow: hidden;
    transition: var(--transition);
    border: 1px solid var(--season-accent-border, rgba(218,190,160,0.2));
    box-shadow: 0 16px 48px rgba(0,0,0,0.28);
  }

  .card:hover {
    transform: scale(1.08) translateY(-6px);
    z-index: 10;
    border-color: var(--season-accent, rgba(193,138,89,0.6));
    box-shadow: 0 12px 30px var(--season-accent-soft, rgba(170,112,62,0.18));
  }

  .card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
    background: var(--bg-dark);
    opacity: 0.9;
  }

  .card-info {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
    opacity: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px;
    transition: var(--transition);
  }

  .card:hover .card-info {
    opacity: 1;
  }

  .card-title {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text-main);
  }

  .card-meta {
    font-size: 0.75rem;
    color: var(--secondary-color);
    margin-top: 4px;
  }

  #modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(16px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  #box {
    background: var(--panel-bg, linear-gradient(135deg, #342317, #261a11 58%, #100b07));
    border: 1px solid var(--season-accent-border, rgba(193,138,89,0.38));
    border-radius: 16px;
    max-width: 900px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 28px;
    box-shadow: 0 18px 52px rgba(0,0,0,0.42);
    position: relative;
  }

  .player-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    margin-top: 16px;
    border: 1px solid var(--season-accent-border, rgba(193,138,89,0.38));
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--nav-bg, linear-gradient(135deg, #342317, #261a11));
    color: var(--text-main);
    border: 1px solid var(--season-accent-border, rgba(218,190,160,0.2));
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    z-index: 2;
    transition: var(--transition);
  }

  .close-btn:hover {
    border-color: #ef4444;
    color: #ef4444;
  }

  #setup {
    padding: 40px 20px;
    max-width: 520px;
    margin: 80px auto;
    line-height: 1.5;
    background: var(--panel-bg, linear-gradient(135deg, #342317, #261a11 58%, #100b07));
    border: 1px solid var(--season-accent-border, rgba(193,138,89,0.38));
    border-radius: 16px;
    box-shadow: 0 18px 52px rgba(0,0,0,0.42);
  }

  a { color: var(--secondary-color); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>

<style id="geeked-seasonal-glass-theme">
:root {
  --secondary-color: #c18a59;
  --season-accent: #c18a59;
  --season-accent-rgb: 193,138,89;
  --season-accent-soft: rgba(170,112,62,.18);
  --season-accent-border: rgba(193,138,89,.48);
  --bg-dark: #100b07;
  --text-main: #fff5e9;
  --text-muted: #c5a487;
  --nav-bg: linear-gradient(135deg, #342317, #261a11);
  --panel-bg: linear-gradient(135deg, #342317, #261a11 58%, #100b07);
  --card-bg: #21170f;
}

body[data-season="october"] {
  --secondary-color: #ff922e;
  --season-accent: #ff922e;
  --season-accent-rgb: 255,146,46;
  --season-accent-soft: rgba(255,112,24,.20);
  --season-accent-border: rgba(255,146,46,.48);
  --bg-dark: #0a0705;
  --text-main: #fff3ec;
  --text-muted: #d4a382;
  --nav-bg: linear-gradient(135deg, #2b180d, #1a0f08);
  --panel-bg: linear-gradient(135deg, #2b180d, #1a0f08 58%, #0a0705);
  --card-bg: #1f120a;
}

body[data-season="november-brown"] {
  --secondary-color: #c18a59;
  --season-accent: #c18a59;
  --season-accent-rgb: 193,138,89;
  --season-accent-soft: rgba(170,112,62,.18);
  --season-accent-border: rgba(193,138,89,.48);
  --bg-dark: #100b07;
  --text-main: #fff5e9;
  --text-muted: #c5a487;
  --nav-bg: linear-gradient(135deg, #342317, #261a11);
  --panel-bg: linear-gradient(135deg, #342317, #261a11 58%, #100b07);
  --card-bg: #21170f;
}

body[data-season="winter-blue"] {
  --secondary-color: #9bdcff;
  --season-accent: #9bdcff;
  --season-accent-rgb: 155,220,255;
  --season-accent-soft: rgba(93,185,255,.18);
  --season-accent-border: rgba(155,220,255,.48);
  --bg-dark: #070a10;
  --text-main: #eef6ff;
  --text-muted: #94b2d2;
  --nav-bg: linear-gradient(135deg, #101c2e, #0a111b);
  --panel-bg: linear-gradient(135deg, #101c2e, #0a111b 58%, #070a10);
  --card-bg: #0d1522;
}

body[data-season="february-pink"] {
  --secondary-color: #ffb6d5;
  --season-accent: #ffb6d5;
  --season-accent-rgb: 255,182,213;
  --season-accent-soft: rgba(255,120,178,.19);
  --season-accent-border: rgba(255,182,213,.5);
  --bg-dark: #10070c;
  --text-main: #fff0f6;
  --text-muted: #d49db6;
  --nav-bg: linear-gradient(135deg, #2b111e, #1a0a12);
  --panel-bg: linear-gradient(135deg, #2b111e, #1a0a12 58%, #10070c);
  --card-bg: #211019;
}

body[data-season="iconic"] {
  --secondary-color: #00ff99;
  --season-accent: #00ff99;
  --season-accent-rgb: 0,255,153;
  --season-accent-soft: rgba(0,255,153,.16);
  --season-accent-border: rgba(0,255,153,.42);
  --bg-dark: #000000;
  --text-main: #ffffff;
  --text-muted: #64748b;
  --nav-bg: rgba(5, 11, 10, 0.95);
  --panel-bg: rgba(5, 11, 10, 0.95);
  --card-bg: rgba(5, 11, 10, 0.92);
}
</style>

</head>
<body data-season="november-brown">

<div id="setup" style="display:none">
  <h2 style="color:var(--secondary-color); margin-top:0;">Enter TMDB API Key</h2>
  <p>Free key available at <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org/settings/api</a>. Use the “API Key (v3 auth)” value.</p>
  <input id="key" style="width:100%" placeholder="API key"><br><br>
  <button onclick="saveKey()">Save Key</button>
</div>

<div id="app" style="display:none">
  <header>
    <div class="nav-controls">
      <select id="cat" onchange="load()">
        <option value="trending/movie/week">Trending Now</option>
        <option value="movie/popular">Popular</option>
        <option value="movie/top_rated">Top Rated</option>
        <option value="movie/upcoming">Upcoming</option>
      </select>
      <input id="q" placeholder="Search titles..." onkeydown="if(event.key==='Enter')search()">
      <button onclick="search()">Search</button>
      <button onclick="localStorage.removeItem('tmdb');location.reload()" title="Change API key">⚙</button>
    </div>
  </header>

  <div id="hero">
    <div class="hero-content">
      <div class="hero-meta" id="hero-meta">--</div>
      <h1 class="hero-title" id="hero-title">--</h1>
      <p class="hero-desc" id="hero-desc">--</p>
      <button class="hero-btn" id="hero-play-btn">▶ Watch Now</button>
    </div>
  </div>

  <div class="section-title" id="section-label">Trending Now</div>
  <div id="grid"></div>
</div>

<div id="modal" onclick="if(event.target===this)closeM()">
  <div id="box"></div>
</div>

<script>
const IMG = 'https://image.tmdb.org/t/p/';
const TMDB_KEY = '6d42f7c1836a0ab76f6b0af9057e1cef';
let KEY = TMDB_KEY || localStorage.getItem('tmdb') || '';
const $ = id => document.getElementById(id);

if(TMDB_KEY) document.addEventListener('DOMContentLoaded', () => {
  const g = document.querySelector('header button[title]');
  if(g) g.remove();
});

function saveKey() {
  const k = $('key').value.trim();
  if(k) { localStorage.setItem('tmdb', k); location.reload(); }
}

async function api(path, params = '') {
  const bearer = KEY.startsWith('eyJ');
  const r = await fetch(`https://api.themoviedb.org/3/${path}?${bearer ? '' : 'api_key=' + KEY + '&'}language=en-US${params}`,
    bearer ? { headers: { Authorization: 'Bearer ' + KEY, accept: 'application/json' } } : {});
  if(!r.ok) {
    let m = '';
    try { m = (await r.json()).status_message || ''; } catch(_) {}
    throw new Error('TMDB returned ' + r.status + (m ? ': ' + m : ''));
  }
  return r.json();
}

function setHero(movie) {
  if(!movie) return;
  const bgPath = movie.backdrop_path ? IMG + 'original' + movie.backdrop_path : (movie.poster_path ? IMG + 'original' + movie.poster_path : '');
  if(bgPath) $('hero').style.backgroundImage = `url('${bgPath}')`;
  
  $('hero-title').innerText = movie.title;
  $('hero-meta').innerText = `${(movie.release_date||'').slice(0,4)} • ⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : '–'}`;
  $('hero-desc').innerText = movie.overview || 'No description available.';
  $('hero-play-btn').onclick = () => detail(movie.id);
}

function render(list) {
  if(list.length > 0) setHero(list[0]);
  
  $('grid').innerHTML = list.map(m => `
    <div class="card" onclick="detail(${m.id})">
      <img loading="lazy" src="${m.poster_path ? IMG + 'w500' + m.poster_path : ''}" alt="${m.title}">
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta">${(m.release_date||'').slice(0,4)} • ⭐ ${m.vote_average ? m.vote_average.toFixed(1) : '–'}</div>
      </div>
    </div>
  `).join('') || '<p style="padding:20px; color:var(--text-muted);">No results found.</p>';
}

async function load() {
  try {
    const catSelect = $('cat');
    $('section-label').innerText = catSelect.options[catSelect.selectedIndex].text;
    const res = await api(catSelect.value);
    render(res.results);
  } catch(e) {
    $('grid').innerHTML = '<p style="padding:20px;">Could not load items: ' + e.message + '</p>';
  }
}

async function search() {
  const q = $('q').value.trim();
  if(!q) return load();
  $('section-label').innerText = `Search Results for "${q}"`;
  const res = await api('search/movie', '&query=' + encodeURIComponent(q));
  render(res.results);
}

async function detail(id) {
  const m = await api('movie/' + id);
  
  $('box').innerHTML = `
    <button class="close-btn" onclick="closeM()">✕</button>
    <h2 style="margin:0 0 6px 0; color:var(--text-main); font-size: 1.8rem;">${m.title}</h2>
    <div style="color:var(--secondary-color); font-weight: 600; margin-bottom: 12px; font-size:0.9rem;">
      ${(m.release_date||'').slice(0,4)} &bull; ${m.genres.map(g => g.name).join(', ')} &bull; ${m.runtime||'?'} min &bull; ⭐ ${m.vote_average.toFixed(1)}
    </div>
    <p style="color:var(--text-muted); line-height:1.5; font-size:0.95rem; margin-bottom: 20px;">${m.overview || ''}</p>
    
    <div class="player-wrapper">
      <iframe src="https://cinesrc.st/embed/movie/${m.id}" allowfullscreen></iframe>
    </div>
  `;
  $('modal').style.display = 'flex';
}

function closeM() {
  $('modal').style.display = 'none';
  $('box').innerHTML = '';
}

if(KEY) {
  $('app').style.display = 'block';
  load();
} else {
  $('setup').style.display = 'block';
}
</script>
<script>
(() => {
 const now = new Date(), month = now.getMonth(), day = now.getDate();
 let season = 'iconic';
 if (month === 9) season = 'october';
 else if (month === 10 && day <= 7) season = 'november-brown';
 else if (month === 10 || month === 11 || month === 0) season = 'winter-blue';
 else if (month === 1) season = 'february-pink';
 document.body.dataset.season = season;
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geeked Sites</title>
    <style>
        /* Remove default browser margins and padding */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Force the iframe to fill the entire viewport */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      allow="fullscreen" is the modern standard.
      allowfullscreen is a legacy fallback for older browsers.
    -->
    <iframe 
        src="https://pdflink.to/geeked/embed/" 
        allow="fullscreen" 
        allowfullscreen>
    </iframe>

</body>
</html>

.topbar {

.nav-btn {

  transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  white-space: nowrap;
}
.nav-btn:hover {
  color: #fff; background: rgba(255,255,255,.07);
  transform: translateY(-1px);
}
.nav-btn.active {
  color: #00ff99;
  background: linear-gradient(110deg, rgba(0,255,153,.14), rgba(0,207,255,.08));
  border-color: rgba(0,255,153,.28);
  box-shadow: inset 0 0 14px rgba(0,255,153,.045), 0 0 12px rgba(0,255,153,.035);

.nav-btn .icon-svg { margin-right: 7px; }

  position: relative; width: 100%; height: 100%; isolation: isolate;

<style id="theme-menu-styles">
.theme-wrap { position: relative; flex: 0 0 auto; padding-left: 7px; border-left: 1px solid var(--season-border-soft); }

  border-color: var(--season-border) !important;
}
.theme-menu {
  position: absolute; right: 0; top: calc(100% + 20px);
  width: 268px; padding: 10px;
  display: none; flex-direction: column; gap: 10px;
  background: linear-gradient(135deg, var(--season-panel-2), var(--season-panel));
  border: 1px solid var(--season-border-soft);
  border-radius: 20px;
  box-shadow: 0 16px 40px rgba(0,0,0,.45), 0 0 26px var(--season-shadow);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.theme-menu.open { display: flex; }

.mode-row { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--season-bg); border: 1px solid var(--season-border-soft); }
.mode-btn {
  appearance: none; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent;
  color: var(--season-muted); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.mode-btn:hover { color: var(--season-text); }
.mode-btn.active { color: var(--season-accent); background: rgba(var(--season-accent-rgb), .14); border-color: var(--season-border); }
.mode-icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

.theme-block { border-radius: 16px; padding: 10px 10px 12px; border: 1px solid var(--blk-border); background: var(--blk-bg); }
.cat-default { --blk-bg: linear-gradient(135deg, #0a211b, #071912); --blk-border: rgba(0,255,153,.30); }
.cat-fall    { --blk-bg: linear-gradient(135deg, #351b0b, #342317); --blk-border: rgba(255,146,46,.38); }
.cat-winter  { --blk-bg: linear-gradient(135deg, #102b40, #3a1b30); --blk-border: rgba(155,220,255,.38); }

html[data-mode="light"] .cat-winter  { --blk-bg: linear-gradient(135deg, #dcedf9, #fbdceb); --blk-border: rgba(26,120,194,.38); }

.cat-default { --blk-label: #9fd8bf; } .cat-fall { --blk-label: #e0b48c; } .cat-winter { --blk-label: #b8d9ef; }
html[data-mode="light"] .cat-default { --blk-label: #2f6b53; } html[data-mode="light"] .cat-fall { --blk-label: #8a5a35; } html[data-mode="light"] .cat-winter { --blk-label: #4a6c85; }

.theme-chip {
  appearance: none; border: 0; background: transparent; padding: 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit;
  color: var(--blk-label);

        <button class="mode-btn" type="button" data-mode="dark" aria-pressed="true"><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>Dark</button>
        <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
      </div>
      <section class="theme-block cat-default">
        <div class="theme-cat">Default</div>
        <div class="theme-chips">
          <button class="theme-chip" type="button" role="menuitemradio" data-theme="iconic" aria-label="Iconic Green" title="Iconic Green"><span class="chip-orb"></span><span class="chip-name">Green</span></button>
        </div>

          <button class="theme-chip" type="button" role="menuitemradio" data-theme="november-brown" aria-label="November Brown" title="November Brown"><span class="chip-orb"></span><span class="chip-name">Brown</span></button>
        </div>

        <div class="theme-cat">Winter</div>

          <button class="theme-chip" type="button" role="menuitemradio" data-theme="winter-blue" aria-label="Winter Blue" title="Winter Blue"><span class="chip-orb"></span><span class="chip-name">Blue</span></button>
          <button class="theme-chip" type="button" role="menuitemradio" data-theme="february-pink" aria-label="February Pink" title="February Pink"><span class="chip-orb"></span><span class="chip-name">Pink</span></button>

<main class="page-wrap">

</main>
<script>
(() => {
  const destinations = {
    games: 'math.html',
    proxy: 'reading.html',
    movies: 'movies.html',
    'online-games': 'science.html',
    ai: 'ai.html'
  };
  const labels = {
    games: 'Games',
    proxy: 'Proxy',
    movies: 'Movies',
    'online-games': 'Online Games',
    ai: 'AI'
  };
  const frame = document.getElementById('sectionFrame');
  const buttons = [...document.querySelectorAll('[data-section]')];
  function showSection(section) {
    if (!destinations[section]) section = 'proxy';
    frame.src = destinations[section];
    frame.title = labels[section];
    buttons.forEach(button => {
      const active = button.dataset.section === section;
      button.classList.toggle('active', active);
      if (active) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    try { history.replaceState(null, '', '#' + section); } catch (_) {}
  }
  buttons.forEach(button => button.addEventListener('click', event => {
    event.preventDefault();
    showSection(button.dataset.section);
  }));
  const initial = location.hash.slice(1);
  if (initial && destinations[initial]) showSection(initial);
})();
</script>

<script>window.addEventListener("beforeunload", (event) => {
  event.preventDefault();
  event.returnValue = true;
});</script>


<script>
(() => {
  const THEMES = ['iconic', 'october', 'november-brown', 'winter-blue', 'february-pink'];
  const MODES = ['dark', 'light'];
  const KEY_THEME = 'siteTheme';
  const KEY_MODE = 'siteMode';
  const KEY_LAST_AUTO = 'siteThemeLastAuto';
  const frame = document.getElementById('sectionFrame');
  const btn = document.getElementById('themeBtn');
  const menu = document.getElementById('themeMenu');
  let currentTheme = 'iconic';
  let currentMode = 'dark';

  // Which seasonal theme the calendar says is current
  function seasonForToday() {
    const now = new Date(), month = now.getMonth(), day = now.getDate();
    if (month === 9) return 'october';
    if (month === 10 && day <= 7) return 'november-brown';
    if (month === 10 || month === 11 || month === 0) return 'winter-blue';
    if (month === 1) return 'february-pink';
    return 'iconic';
  }
  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function write(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

  function stamp(doc) {
    doc.body.dataset.season = currentTheme;
    doc.documentElement.dataset.season = currentTheme;
    doc.body.dataset.mode = currentMode;
    doc.documentElement.dataset.mode = currentMode;
  }

  // Push theme + mode into the page shown in the iframe (same-origin pages only)
  // Light-mode palettes, injected into the page in the frame so it does not need its own copy
  const FRAME_LIGHT_CSS = "html[data-mode=\"light\"][data-season=\"iconic\"], body[data-mode=\"light\"][data-season=\"iconic\"] { --season-bg:#eefaf4; --season-bg-glow:rgba(0,168,107,.16); --season-panel:#ffffff; --season-panel-2:#e4f6ed; --season-panel-hover:#d3efe2; --season-card:#f7fdfa; --season-text:#0b2a1f; --season-muted:#4a6a5c; --season-accent:#00a86b; --season-accent-rgb:0,168,107; --season-border:rgba(0,140,90,.40); --season-border-soft:rgba(20,70,50,.18); --season-shadow:rgba(0,140,90,.18); --season-overlay:rgba(230,245,238,.88); --season-accent-soft:rgba(0,168,107,.14); --season-accent-border:rgba(0,140,90,.48); color-scheme: light; } html[data-mode=\"light\"][data-season=\"october\"], body[data-mode=\"light\"][data-season=\"october\"] { --season-bg:#fff4e8; --season-bg-glow:rgba(255,125,30,.18); --season-panel:#fffaf4; --season-panel-2:#ffe8d0; --season-panel-hover:#ffd9b3; --season-card:#fffaf4; --season-text:#3a1d08; --season-muted:#8a5a35; --season-accent:#d9660a; --season-accent-rgb:217,102,10; --season-border:rgba(217,102,10,.42); --season-border-soft:rgba(120,70,30,.20); --season-shadow:rgba(217,102,10,.20); --season-overlay:rgba(255,240,225,.88); --season-accent-soft:rgba(217,102,10,.16); --season-accent-border:rgba(217,102,10,.50); color-scheme: light; } html[data-mode=\"light\"][data-season=\"november-brown\"], body[data-mode=\"light\"][data-season=\"november-brown\"] { --season-bg:#f6efe6; --season-bg-glow:rgba(174,126,82,.20); --season-panel:#fffaf3; --season-panel-2:#efe2d2; --season-panel-hover:#e3d0ba; --season-card:#faf4ec; --season-text:#2f2013; --season-muted:#7a6048; --season-accent:#9a6232; --season-accent-rgb:154,98,50; --season-border:rgba(154,98,50,.42); --season-border-soft:rgba(90,65,40,.20); --season-shadow:rgba(154,98,50,.20); --season-overlay:rgba(246,239,230,.88); --season-accent-soft:rgba(154,98,50,.16); --season-accent-border:rgba(154,98,50,.50); color-scheme: light; } html[data-mode=\"light\"][data-season=\"winter-blue\"], body[data-mode=\"light\"][data-season=\"winter-blue\"] { --season-bg:#eaf5fd; --season-bg-glow:rgba(70,160,230,.20); --season-panel:#fbfeff; --season-panel-2:#dcedf9; --season-panel-hover:#c9e3f5; --season-card:#f3faff; --season-text:#0c2335; --season-muted:#4a6c85; --season-accent:#1a78c2; --season-accent-rgb:26,120,194; --season-border:rgba(26,120,194,.42); --season-border-soft:rgba(30,70,110,.18); --season-shadow:rgba(26,120,194,.20); --season-overlay:rgba(234,245,253,.88); --season-accent-soft:rgba(26,120,194,.16); --season-accent-border:rgba(26,120,194,.50); color-scheme: light; } html[data-mode=\"light\"][data-season=\"february-pink\"], body[data-mode=\"light\"][data-season=\"february-pink\"] { --season-bg:#fdeef5; --season-bg-glow:rgba(255,120,178,.20); --season-panel:#fffafd; --season-panel-2:#fbdceb; --season-panel-hover:#f7c8de; --season-card:#fff5fa; --season-text:#3a1428; --season-muted:#8a5570; --season-accent:#d6407f; --season-accent-rgb:214,64,127; --season-border:rgba(214,64,127,.42); --season-border-soft:rgba(110,50,80,.18); --season-shadow:rgba(214,64,127,.20); --season-overlay:rgba(253,238,245,.88); --season-accent-soft:rgba(214,64,127,.16); --season-accent-border:rgba(214,64,127,.50); color-scheme: light; }";
  function ensurePalette(doc) {
    if (doc.getElementById('index-light-palette') || !doc.head) return;
    const st = doc.createElement('style');
    st.id = 'index-light-palette';
    st.textContent = FRAME_LIGHT_CSS;
    doc.head.appendChild(st);
  }

  function applyToFrame() {
    try { frame.contentWindow.postMessage({ siteTheme: { theme: currentTheme, mode: currentMode } }, '*'); } catch (e) {}
    try {
      const doc = frame.contentDocument, win = frame.contentWindow;
      if (!doc || !doc.body) return;
      ensurePalette(doc);
      stamp(doc);
      const rgb = win.getComputedStyle(doc.documentElement).getPropertyValue('--season-accent-rgb').trim();
      if (rgb) win.__accentRgb = rgb;
    } catch (e) { /* cross-origin page: leave it alone */ }
  }

  function render() {
    stamp(document);
    menu.querySelectorAll('.theme-chip').forEach(chip => {
      const on = chip.dataset.theme === currentTheme;
      chip.classList.toggle('active', on);
      chip.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    menu.querySelectorAll('.mode-btn').forEach(b => {
      const on = b.dataset.mode === currentMode;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    applyToFrame();
  }

  function setMenu(open) {
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  btn.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
  menu.addEventListener('click', e => {
    const chip = e.target.closest('.theme-chip');
    if (chip && THEMES.includes(chip.dataset.theme)) {
      currentTheme = chip.dataset.theme;
      write(KEY_THEME, currentTheme);
      render();
      setMenu(false);
      return;
    }
    const modeBtn = e.target.closest('.mode-btn');
    if (modeBtn && MODES.includes(modeBtn.dataset.mode)) {
      currentMode = modeBtn.dataset.mode;
      write(KEY_MODE, currentMode);
      render();
    }
  });
  document.addEventListener('click', e => { if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

  // Re-apply whenever a different section loads in the iframe
  frame.addEventListener('load', () => { applyToFrame(); setTimeout(applyToFrame, 300); setTimeout(applyToFrame, 1500); });

  // On load: keep the user's choice, except switch the THEME automatically ONE time
  // when a new seasonal period has started since the last automatic switch.
  const today = seasonForToday();
  let theme = read(KEY_THEME);
  if (read(KEY_LAST_AUTO) !== today) {
    theme = today;
    write(KEY_LAST_AUTO, today);
    write(KEY_THEME, today);
  }
  currentTheme = THEMES.includes(theme) ? theme : today;
  const savedMode = read(KEY_MODE);
  currentMode = MODES.includes(savedMode) ? savedMode : 'dark';
  render();
})();
</script>

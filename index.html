<style>
:root {
  --bg: #010206;
  --text: #f4fff9;
  --muted: #8ca99f;
  --accent: #00ff99;
  --accent2: #00cfff;
  --glass: rgba(5, 17, 16, .86);
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}
.topbar {
  position: fixed;
  z-index: 10000;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100vw - 28px);
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 8px 11px 8px 15px;
  border: 1px solid rgba(190, 220, 230, .15);
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(7, 25, 19, .94), rgba(3, 11, 17, .91));
  box-shadow: 0 12px 38px rgba(0,0,0,.42), 0 0 24px rgba(0,255,153,.055), inset 0 1px 0 rgba(0,255,153,.13);
  -webkit-backdrop-filter: blur(24px) saturate(155%);
  backdrop-filter: blur(24px) saturate(155%);
}
.brand {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  flex: 0 0 auto; text-decoration: none; min-width: 0;
  padding: 0 7px 0 1px;
}
.brand img { width: 44px; height: 44px; object-fit: contain; }
.brand-name { font-size: 13px; font-weight: 800; letter-spacing: -.35px; color: var(--text); }
.brand-dot { color: var(--accent); }
.nav {
  display: flex; align-items: center; gap: 0;
  padding-left: 7px;
  border-left: 1px solid rgba(255,255,255,.11);
}
.nav-btn {
  appearance: none; border: 1px solid transparent; color: #b5c9c2;
  background: transparent; border-radius: 999px; padding: 10px 10px;
  font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
  transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  white-space: nowrap;
}
.nav-btn:hover {
  color: #fff; background: rgba(255,255,255,.07);
  transform: translateY(-1px);
}
.nav-btn.active {
  color: #00ff99;
  background: linear-gradient(110deg, rgba(0,255,153,.14), rgba(0,207,255,.08));
  border-color: rgba(0,255,153,.28);
  box-shadow: inset 0 0 14px rgba(0,255,153,.045), 0 0 12px rgba(0,255,153,.035);
}
.nav-btn .icon-svg { margin-right: 7px; }
/* Tighten only the space between Online Games and AI. */
.nav-btn[data-section="ai"] { margin-left: -4px; }
.page-wrap {
  position: relative; z-index: 0; width: 100%; height: 100%; isolation: isolate;
  background:
    radial-gradient(ellipse at 18% -5%, rgba(0,255,153,.075), transparent 34%),
    radial-gradient(ellipse at 90% 0%, rgba(0,207,255,.065), transparent 28%),
    var(--bg);
}
.page-frame { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
@media (max-width: 680px) {
  .topbar {
    top: 10px; width: calc(100vw - 20px); max-width: 520px;
    min-height: 54px; padding: 7px 8px; gap: 7px;
  }
  .brand { gap: 5px; padding-right: 5px; }
  .brand img { width: 38px; height: 38px; }
  .brand-name { display: none; }
  .nav { gap: 1px; padding-left: 6px; min-width: 0; }
  .nav-btn { padding: 9px 8px; font-size: 11px; }
  .nav-btn .icon-svg { margin-right: 4px; }
}
@media (max-width: 430px) {
  .topbar { gap: 4px; }
  .brand img { width: 34px; height: 34px; }
  .nav-btn { padding: 9px 7px; font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

.icon-svg {
  width: 17px;
  height: 17px;
  display: inline-block;
  vertical-align: -3px;
  margin-right: 6px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: 0 0 auto;
}
.games-icon { width: 18px; height: 18px; vertical-align: -3px; margin-right: 7px; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn.active .icon-svg { filter: drop-shadow(0 0 4px rgba(0,255,153,.25)); }
.ai-robot-icon {
  stroke-width: 1.3;
  width: 23px;
  height: 23px;
  vertical-align: -6px;
  margin-right: 7px;
}
@media (max-width: 680px) {
  .games-icon { width: 16px; height: 16px; margin-right: 4px; }
  .ai-robot-icon { width: 21px; height: 21px; margin-right: 4px; }
}
@media (max-width: 680px) { .icon-svg { width: 15px; height: 15px; margin-right: 3px; } }
@media (max-width: 430px) { .icon-svg { display: none; } }

/* Keep the menu and its collapse handle above the iframe without altering menu positioning. */
.topbar { z-index: 10000; }
.bar-zone { z-index: 10001; }
.page-wrap { z-index: 0; }
</style>

<style id="theme-menu-styles">
.theme-wrap { position: relative; flex: 0 0 auto; padding-left: 7px; border-left: 1px solid var(--season-border-soft); }
.theme-btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 12px; }
.waffle-icon { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; display: block; }
.theme-btn[aria-expanded="true"] {
  color: var(--season-accent) !important;

  border-color: var(--season-border) !important;
}
.theme-menu {

<style id="menu-collapse-css">
/* ---- Collapsible menu: shrinks into a small rounded square that keeps the logo ---- */
.topbar.bar-anim, .topbar.is-collapsed { min-height: 0; overflow: hidden; flex-wrap: nowrap; justify-content: flex-start; max-width: none; }
.topbar.bar-anim {
  transition: width .38s cubic-bezier(.4,0,.2,1), height .38s cubic-bezier(.4,0,.2,1),
              padding .38s cubic-bezier(.4,0,.2,1), gap .38s cubic-bezier(.4,0,.2,1),
              border-radius .38s cubic-bezier(.4,0,.2,1), transform .38s cubic-bezier(.4,0,.2,1);
}
.topbar .nav, .topbar .theme-wrap { transition: opacity .22s ease; }
.topbar .brand img { transition: width .38s ease, height .38s ease; }
.topbar.is-collapsed { padding: 6px; gap: 0; cursor: pointer; transform: translate(-50%, var(--bar-shift, 4px)); }
.topbar.is-collapsed .brand { padding: 0; }
.topbar.is-collapsed .brand img { width: 38px; height: 38px; }
.topbar.is-collapsed .nav, .topbar.is-collapsed .theme-wrap { opacity: 0; pointer-events: none; }
.topbar.is-collapsed.is-done .nav, .topbar.is-collapsed.is-done .theme-wrap { display: none; }

/* ---- Small tag under the menu that toggles it; fades away when the cursor is not near ---- */
.bar-zone {
  position: fixed; z-index: 10001; left: 50%;
  top: calc(var(--bar-bottom, 76px) - 2px);
  width: 140px; height: 40px; padding-top: 6px;
  transform: translateX(-50%);
  display: flex; justify-content: center; align-items: flex-start;
  transition: top .38s cubic-bezier(.4,0,.2,1);
}
.bar-tag {
  appearance: none; width: 54px; height: 18px; padding: 0; cursor: pointer;
  display: grid; place-items: center; border-radius: 999px;
  border: 1px solid var(--season-border-soft, rgba(190,220,230,.18));
  background: linear-gradient(135deg, var(--season-panel-2, rgba(7,25,19,.94)), var(--season-panel, rgba(3,11,17,.91)));
  color: var(--season-accent, var(--accent));
  box-shadow: 0 6px 18px rgba(0,0,0,.4);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  opacity: 0;
  transition: opacity .6s ease .6s, transform .2s ease;   /* lingers briefly, then fades */
}
.bar-tag svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s ease; }
body.bar-collapsed .bar-tag svg { transform: rotate(180deg); }
.bar-zone.near .bar-tag, .bar-tag:focus-visible { opacity: 1; transition: opacity .2s ease, transform .2s ease; }
.bar-tag:hover { transform: translateY(1px); }
.bar-tag:focus-visible { outline: 2px solid var(--season-accent, var(--accent)); outline-offset: 2px; }
@media (hover: none) { .bar-tag { opacity: .6; } }   /* touch screens have no hover */
</style>

(() => {
  const destinations = {

    proxy: 'reading.html',
    movies: 'movies.html',
    music: 'music.html',
    'online-games': 'science.html',
    ai: 'ai.html'

    proxy: 'Proxy',
    movies: 'Movies',

    'online-games': 'Online Games',
    ai: 'AI'
  };
  const frame = document.getElementById('sectionFrame');
  const buttons = [...document.querySelectorAll('[data-section]')];
  function showSection(section) {
    if (!destinations[section]) section = 'proxy';
    frame.src = destinations[section];
    frame.title = labels[section];
    buttons.forEach(button => {
      const active = button.dataset.section === section;
      button.classList.toggle('active', active);
      if (active) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    try { history.replaceState(null, '', '#' + section); } catch (_) {}
  }
  buttons.forEach(button => button.addEventListener('click', event => {
    event.preventDefault();
    showSection(button.dataset.section);
  }));
  const initial = location.hash.slice(1);
  if (initial && destinations[initial]) showSection(initial);
})();

<script>
(() => {
  const THEMES = ['iconic', 'october', 'november-brown', 'winter-blue', 'february-pink'];
  const KEY_THEME = 'siteTheme';
  const KEY_LAYOUT = 'siteLayout';
  const KEY_LAST_AUTO = 'siteThemeLastAuto';
  const frame = document.getElementById('sectionFrame');
  const btn = document.getElementById('themeBtn');
  const menu = document.getElementById('themeMenu');
  const topbar = document.querySelector('.topbar');
  // Keep the settings panel outside the transformed menu/header so fixed viewport positioning works in every layout.
  document.body.appendChild(menu);
  let currentTheme = 'iconic';
  const currentMode = 'dark';   // dark only: pages in the frame are always told 'dark'

  // Which seasonal theme the calendar says is current
  function seasonForToday() {
    const now = new Date(), month = now.getMonth(), day = now.getDate();
    if (month === 9) return 'october';
    if (month === 10 && day <= 7) return 'november-brown';
    if (month === 10 || month === 11 || month === 0) return 'winter-blue';
    if (month === 1) return 'february-pink';
    return 'iconic';
  }
  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function write(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

  function stamp(doc) {
    doc.body.dataset.season = currentTheme;
    doc.documentElement.dataset.season = currentTheme;
    doc.body.dataset.mode = currentMode;
    doc.documentElement.dataset.mode = currentMode;
  }

  function applyToFrame() {
    try { frame.contentWindow.postMessage({ siteTheme: { theme: currentTheme, mode: currentMode } }, '*'); } catch (e) {}
    try {
      const doc = frame.contentDocument, win = frame.contentWindow;
      if (!doc || !doc.body) return;
      stamp(doc);
      const rgb = win.getComputedStyle(doc.documentElement).getPropertyValue('--season-accent-rgb').trim();
      if (rgb) win.__accentRgb = rgb;
    } catch (e) { /* cross-origin page: leave it alone */ }
  }

  function render() {
    stamp(document);
    menu.querySelectorAll('.theme-chip').forEach(chip => {
      const on = chip.dataset.theme === currentTheme;
      chip.classList.toggle('active', on);
      chip.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    applyToFrame();
  }

  // ----- settings: categories (tabs) and layout -----
  const LAYOUT_VALUES = { menuSize: ['small', 'default', 'large'], navLabels: ['both', 'icons', 'text'], menuPos: ['top', 'bottom', 'left', 'right'] };
  const LAYOUT_ATTR = { menuSize: 'data-menu-size', navLabels: 'data-nav-labels', menuPos: 'data-menu-pos' };
  const layout = { menuSize: 'default', navLabels: 'both', menuPos: 'top' };
  try {
    const saved = JSON.parse(read(KEY_LAYOUT) || '{}');
    Object.keys(layout).forEach(k => { if (k === 'menuPos') { if (['top','bottom','left','right'].includes(saved[k])) layout[k] = saved[k]; } else if (LAYOUT_VALUES[k].includes(saved[k])) layout[k] = saved[k]; });
  } catch (e) {}

  function applyLayout() {
    const sidePosition = layout.menuPos === 'left' || layout.menuPos === 'right';
    if (sidePosition && layout.navLabels !== 'icons') layout.navLabels = 'icons';
    Object.keys(layout).forEach(k => document.documentElement.setAttribute(LAYOUT_ATTR[k], layout[k]));
    menu.querySelectorAll('.seg[data-setting="navLabels"] .seg-btn').forEach(button => {
      const unavailable = sidePosition && button.dataset.value !== 'icons';
      button.disabled = unavailable;
      button.hidden = unavailable;
      button.setAttribute('aria-disabled', unavailable ? 'true' : 'false');
    });
    menu.querySelectorAll('.seg').forEach(seg => {
      seg.querySelectorAll('.seg-btn').forEach(b => {
        const on = b.dataset.value === layout[seg.dataset.setting];
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
  }

  function showTab(name) {
    menu.querySelectorAll('.set-tab').forEach(t => {
      const on = t.dataset.tab === name;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    menu.querySelectorAll('.set-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
  }

  // tooltips + labels for the menu buttons (they matter when only icons are shown)
  document.querySelectorAll('.nav .nav-btn').forEach(b => {
    const t = b.textContent.trim();
    if (t) { b.title = t; b.setAttribute('aria-label', t); }
  });

  function repositionMenu() {
    if (!menu.classList.contains('open')) return;
    const bar = topbar.getBoundingClientRect();
    const pos = document.documentElement.dataset.menuPos || 'top';
    const gap = 12, pad = 8;
    const mw = menu.offsetWidth || 268;
    const mh = menu.offsetHeight || 420;
    let left, top;

    if (pos === 'left') {
      // Side menu on the left: settings panel opens to its right.
      left = bar.right + gap;
      top = bar.top + (bar.height - mh) / 2;
    } else if (pos === 'right') {
      // Side menu on the right: settings panel opens to its left.
      left = bar.left - mw - gap;
      top = bar.top + (bar.height - mh) / 2;
    } else if (pos === 'bottom') {
      // Bottom menu: settings panel opens above it.
      left = bar.left + (bar.width - mw) / 2;
      top = bar.top - mh - gap;
    } else {
      // Top menu: settings panel opens below it.
      left = bar.right - mw;
      top = bar.bottom + gap;
    }

    // Keep the entire panel on-screen, including on short or narrow viewports.
    left = Math.max(pad, Math.min(left, innerWidth - mw - pad));
    top = Math.max(pad, Math.min(top, innerHeight - mh - pad));
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  }

  function setMenu(open) {
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) repositionMenu();
  }

  btn.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
  window.addEventListener('resize', repositionMenu);
  menu.addEventListener('click', e => {
    const chip = e.target.closest('.theme-chip');
    if (chip && THEMES.includes(chip.dataset.theme)) {
      currentTheme = chip.dataset.theme;
      write(KEY_THEME, currentTheme);
      render();
      setMenu(false);
      return;
    }
    const tab = e.target.closest('.set-tab');
    if (tab) { showTab(tab.dataset.tab); return; }
    const segBtn = e.target.closest('.seg-btn');
    if (segBtn) {
      const key = segBtn.closest('.seg').dataset.setting;
      if (LAYOUT_VALUES[key] && LAYOUT_VALUES[key].includes(segBtn.dataset.value)) {
        layout[key] = segBtn.dataset.value;
        write(KEY_LAYOUT, JSON.stringify(layout));
        applyLayout();
        repositionMenu();
      }
    }
  });
  document.addEventListener('click', e => { if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

  // Re-apply whenever a different section loads in the iframe
  frame.addEventListener('load', () => { applyToFrame(); setTimeout(applyToFrame, 300); setTimeout(applyToFrame, 1500); });

  // On load: keep the user's choice, except switch the THEME automatically ONE time
  // when a new seasonal period has started since the last automatic switch.
  const today = seasonForToday();
  let theme = read(KEY_THEME);
  if (read(KEY_LAST_AUTO) !== today) {
    theme = today;
    write(KEY_LAST_AUTO, today);
    write(KEY_THEME, today);
  }
  currentTheme = THEMES.includes(theme) ? theme : today;
  applyLayout();
  render();
})();
</script>

<script>
(() => {
  const topbar = document.querySelector('.topbar');
  const zone = document.getElementById('barZone');
  const tag = document.getElementById('barTag');
  if (!topbar || !zone || !tag) return;

  const SQUARE = 52;      // size of the collapsed rounded square (px)
  const DUR = 400;        // a little longer than the .38s CSS transition
  const root = document.documentElement;
  let token = 0;          // lets a quick second click cancel a running animation
  let fullH = 60;

  const isCollapsed = () => topbar.classList.contains('is-collapsed');
  const topPx = () => parseFloat(getComputedStyle(topbar).top) || 15;

  function closeThemeMenu() {
    const menu = document.getElementById('themeMenu'), btn = document.getElementById('themeBtn');
    if (menu) menu.classList.remove('open');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }

  // Where the tag sits: directly under whatever the menu currently looks like
  function barPos() { return document.documentElement.dataset.menuPos || 'top'; }

  function placeTag(collapsed, h) {
    fullH = h;
    const shift = (h - SQUARE) / 2;
    const pos = barPos();
    root.style.setProperty('--bar-shift', shift + 'px');
    if (pos === 'top') {
      root.style.setProperty('--bar-bottom', (topPx() + (collapsed ? shift + SQUARE : h)) + 'px');
    } else if (pos === 'bottom') {
      root.style.setProperty('--bar-bottom-offset', (collapsed ? shift + SQUARE : h) + 15 + 'px');
    } else {
      const r = topbar.getBoundingClientRect();
      root.style.setProperty('--bar-right', r.right + 'px');
      root.style.setProperty('--bar-left', r.left + 'px');
      root.style.setProperty('--bar-w', r.width + 'px');
    }
    root.style.setProperty('--bar-h', (collapsed ? shift + SQUARE : h) + 'px');
  }

  function setTagState(collapsed) {
    document.body.classList.toggle('bar-collapsed', collapsed);
    tag.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    const label = collapsed ? 'Expand menu' : 'Collapse menu';
    tag.setAttribute('aria-label', label);
    tag.title = label;
  }

  // Measure the menu at its natural (expanded) size
  function measureFull() {
    topbar.classList.remove('is-collapsed', 'is-done', 'bar-anim');
    topbar.style.width = ''; topbar.style.height = ''; topbar.style.borderRadius = '';
    const r = topbar.getBoundingClientRect();
    return { w: r.width, h: r.height };
  }

  function collapse() {
    const my = ++token;
    closeThemeMenu();
    const full = measureFull();
    topbar.style.width = full.w + 'px';
    topbar.style.height = full.h + 'px';
    topbar.style.borderRadius = (full.h / 2) + 'px';
    placeTag(true, full.h);
    topbar.classList.add('bar-anim');
    void topbar.offsetWidth;                         // commit the starting state
    topbar.classList.add('is-collapsed');
    topbar.style.width = SQUARE + 'px';
    topbar.style.height = SQUARE + 'px';
    topbar.style.borderRadius = '16px';
    setTagState(true);
    setTimeout(() => { if (token === my) topbar.classList.add('is-done'); }, DUR);
  }

  function expand() {
    const my = ++token;
    const full = measureFull();                      // natural size, no animation
    topbar.classList.add('is-collapsed');            // jump back to the square (no transition yet)
    topbar.style.width = SQUARE + 'px';
    topbar.style.height = SQUARE + 'px';
    topbar.style.borderRadius = '16px';
    placeTag(false, full.h);
    void topbar.offsetWidth;
    topbar.classList.add('bar-anim');
    void topbar.offsetWidth;
    topbar.classList.remove('is-collapsed');         // now animate out to full size
    topbar.style.width = full.w + 'px';
    topbar.style.height = full.h + 'px';
    topbar.style.borderRadius = (full.h / 2) + 'px';
    setTagState(false);
    setTimeout(() => {
      if (token !== my) return;
      topbar.classList.remove('bar-anim');
      topbar.style.width = ''; topbar.style.height = ''; topbar.style.borderRadius = '';
      placeTag(false, topbar.offsetHeight);
    }, DUR);
  }

  const toggle = () => (isCollapsed() ? expand() : collapse());
  tag.addEventListener('click', toggle);

  // Clicking the little square (the logo) opens the menu again instead of navigating
  topbar.addEventListener('click', e => {
    if (isCollapsed()) { e.preventDefault(); e.stopImmediatePropagation(); expand(); }
  }, true);

  // Keep the tag positioned correctly when the menu changes size (only while expanded and idle)
  function refresh() {
    if (isCollapsed() || topbar.classList.contains('bar-anim')) return;
    placeTag(false, topbar.offsetHeight);
  }
  refresh();
  window.addEventListener('resize', refresh);
  window.addEventListener('load', refresh);
  if (window.ResizeObserver) new ResizeObserver(refresh).observe(topbar);

  // Fade in when the cursor is near the tag, fade out when it moves away
  const setNear = on => zone.classList.toggle('near', on);
  document.addEventListener('mousemove', e => {
    const r = zone.getBoundingClientRect();
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    setNear(Math.hypot(dx, dy) < 90);
  });
  zone.addEventListener('mouseenter', () => setNear(true));   // also works over the iframe
  zone.addEventListener('mouseleave', () => setNear(false));
  document.addEventListener('mouseleave', () => setNear(false));
})();
</script>

<script>
(() => {
  // ====== SUPABASE CONFIG ======
  const SUPABASE_URL = 'https://qmxzlgftdtrmqlkmythc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_m3_Ry6pJqb8JJGu0zNxOrw_95DjdeOG'; // Supabase dashboard > Project Settings > API > "anon public" key
  // =============================

  const $ = id => document.getElementById(id);
  const statusBox = $('acctStatus'), statusText = $('acctStatusText');
  const inView = $('acctIn'), outView = $('acctOut'), emailLabel = $('acctEmail');
  const form = $('acctForm'), emailInput = $('acctEmailInput'), passInput = $('acctPassInput');
  const submitBtn = $('acctSubmit'), googleBtn = $('acctGoogle'), logoutBtn = $('acctLogout'), msg = $('acctMsg');
  let mode = 'signin';
  let sb = null;

  // The settings panel changes height between tabs, so ask the menu to re-position itself.
  const reflow = () => setTimeout(() => window.dispatchEvent(new Event('resize')), 0);

  function say(text, kind) {
    if (!text) { msg.hidden = true; msg.textContent = ''; msg.className = 'acct-msg'; }
    else { msg.hidden = false; msg.textContent = text; msg.className = 'acct-msg ' + (kind || ''); }
    reflow();
  }

  function render(session) {
    const user = session && session.user;
    statusBox.classList.toggle('on', !!user);
    statusBox.classList.toggle('off', !user);
    statusText.textContent = user ? 'Logged in' : 'Not logged in';
    inView.hidden = !user;
    outView.hidden = !!user;
    emailLabel.textContent = user ? (user.email || 'Signed in') : '';
    if (user) say('');
    reflow();
  }

  function setMode(next) {
    mode = next;
    document.querySelectorAll('.acct-mode').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    passInput.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    say('');
  }

  document.querySelectorAll('.acct-mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.querySelector('.set-tab[data-tab="account"]').addEventListener('click', reflow);

  if (!window.supabase || SUPABASE_ANON_KEY.startsWith('PASTE_')) {
    render(null);
    statusText.textContent = 'Not set up';
    say(!window.supabase ? 'Could not load Supabase.' : 'Add your Supabase anon key in index.html to turn on accounts.', 'error');
    submitBtn.disabled = googleBtn.disabled = true;
    return;
  }

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const redirectTo = location.origin + location.pathname;

  sb.auth.getSession().then(({ data }) => render(data.session));
  sb.auth.onAuthStateChange((_event, session) => render(session));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const email = emailInput.value.trim(), password = passInput.value;
    if (!email || !password) return say('Enter your email and password.', 'error');
    if (mode === 'signup' && password.length < 6) return say('Password must be at least 6 characters.', 'error');
    submitBtn.disabled = true; say('');
    try {
      if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: redirectTo } });
        if (error) throw error;
        if (data.user && data.user.identities && data.user.identities.length === 0) {
          say('That email already has an account. Try signing in.', 'error');
        } else if (!data.session) {
          say('Check your email to confirm your account, then sign in.', 'ok');
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        passInput.value = '';
      }
    } catch (err) {
      say(err.message || 'Something went wrong.', 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  googleBtn.addEventListener('click', async () => {
    say('');
    window.__authRedirect = true; // skip the "Leave site?" prompt for this redirect
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
    if (error) { window.__authRedirect = false; say(error.message, 'error'); }
  });

  logoutBtn.addEventListener('click', async () => {
    logoutBtn.disabled = true;
    const { error } = await sb.auth.signOut();
    logoutBtn.disabled = false;
    if (error) say(error.message, 'error');
  });
})();
</script>

<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Gorilla Tag Web</title>
    <link rel="shortcut icon" href="gtag/TemplateData/favicon.ico">
    <link rel="stylesheet" href="gtag/TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #231F20;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: fixed;
        left: 0;
        top: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
      }

      /* Permanently hide all default Unity loader and warning elements so they never get stuck */
      #unity-loading-bar,
      #unity-logo,
      #unity-fullscreen-button,
      #unity-footer,
      #unity-build-title,
      #unity-webgl-logo,
      #unity-logo,
      #unity-warning {
        display: none !important;
      }

      /* Dedicated crosshair dot centered permanently on screen */
      #game-crosshair {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 8px !important;
        height: 8px !important;
        background: rgba(255, 255, 255, 0.85) !important;
        border: 1px solid rgba(0, 0, 0, 0.6) !important;
        border-radius: 50% !important;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.5) !important;
        pointer-events: none !important;
        display: block !important;
        z-index: 99999;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <!-- Injected crosshair dot element -->
    <div id="game-crosshair"></div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      var buildUrl = "gtag/Build";
      var loaderUrl = buildUrl + "/gtagweb.loader.js";
      var config = {
        dataUrl: buildUrl + "/gtagweb.data.unityweb",
        frameworkUrl: buildUrl + "/gtagweb.framework.js.unityweb",
        codeUrl: buildUrl + "/gtagweb.wasm.unityweb",
        streamingAssetsUrl: "gtag/StreamingAssets",
        companyName: "boolonx",
        productName: "gorilla tag web",
        productVersion: "1.0",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Progress is handled silently in the background
        }).then((unityInstance) => {
          // Game loaded successfully
        }).catch((message) => {
          console.error(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>

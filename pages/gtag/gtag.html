<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Gorilla Tag Web</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#231F20; }
      #unity-container { width:100%; height:100%; position:fixed; left:0; top:0; }
      #unity-canvas { width:100%; height:100%; background:#231F20; position:absolute; top:0; left:0; }

      #unity-logo, #unity-fullscreen-button, #unity-footer,
      #unity-build-title, #unity-webgl-logo, #unity-warning { display:none !important; }

      #unity-loading-bar { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:block; z-index:1000; }
      #unity-progress-bar-empty {
        width:350px; height:16px; background:rgba(255,255,255,.15); border-radius:8px;
        overflow:hidden; padding:2px; box-shadow:0 0 10px rgba(0,0,0,.5); box-sizing:border-box;
      }
      #unity-progress-bar-full { height:100%; width:0%; background:#00ff99; border-radius:6px; transition:width .1s ease-out; box-sizing:border-box; }

      #game-crosshair {
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        width:8px; height:8px; pointer-events:none; display:none; z-index:2147483647;
      }
      #game-crosshair::before, #game-crosshair::after {
        content:''; position:absolute; background:#00ff99; box-shadow:0 0 2px rgba(0,0,0,.8);
      }
      #game-crosshair::before { top:3px; left:0; width:8px; height:2px; }
      #game-crosshair::after  { top:0; left:3px; width:2px; height:8px; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="game-crosshair"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var crosshair = document.querySelector("#game-crosshair");

      // FIXED: paths are relative to THIS folder (was "gtag/Build", which doubled the folder name)
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/gtagweb.loader.js";
      var config = {
        dataUrl: buildUrl + "/gtagweb.data.unityweb",
        frameworkUrl: buildUrl + "/gtagweb.framework.js.unityweb",
        codeUrl: buildUrl + "/gtagweb.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "boolonx",
        productName: "gorilla tag web",
        productVersion: "1.0",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.head.appendChild(meta);
      }

      function showError(msg) {
        console.error(msg);
        if (loadingBar) {
          loadingBar.style.cssText += ";color:#ffbdab;font:14px system-ui,sans-serif;text-align:center;width:80vw";
          loadingBar.textContent = "Failed to load: " + msg + " (see browser console / Network tab)";
        }
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = function () { showError("could not fetch " + loaderUrl); };
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          if (progressBarFull) progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          setTimeout(function () {
            try {
              unityInstance.SendMessage("LeftHandController", "SetLocalPosition", "-0.6, 0.0, 0.5");
              unityInstance.SendMessage("RightHandController", "SetLocalPosition", "0.6, 0.0, 0.5");
            } catch (e) {
              try {
                unityInstance.SendMessage("LeftHandTrigger", "transform.localPosition.x", -0.6);
                unityInstance.SendMessage("RightHandTrigger", "transform.localPosition.x", 0.6);
              } catch (e2) { console.warn(e2); }
            }
          }, 3500);
          if (loadingBar) loadingBar.style.display = "none";
          if (crosshair) crosshair.style.display = "block";
        }).catch(showError);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>

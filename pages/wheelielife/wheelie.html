<!DOCTYPE html>
<!-- Based on a TurboWarp packager export; modified to load script.js and assets from jsDelivr -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>Soflo Wheelie Life</title>
  <style>
    body { color:#fff; font-family:sans-serif; overflow:hidden; margin:0; padding:0; }
    :root, body.is-fullscreen { background-color:#000; }
    [hidden] { display:none !important; }
    h1 { font-weight:normal; }
    a { color:inherit; text-decoration:underline; cursor:pointer; }
    #app, #loading, #error { position:absolute; top:0; left:0; width:100%; height:100%; }
    .screen { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:default; user-select:none; -webkit-user-select:none; background-color:#000; }
    .progress-bar-outer { border:1px solid currentColor; height:10px; width:200px; max-width:200px; }
    .progress-bar-inner { height:100%; width:0; background-color:currentColor; }
    .loading-text, noscript { font-weight:normal; font-size:36px; margin:0 0 16px; }
    #error-message, #error-stack { font-family:monospace; max-width:600px; white-space:pre-wrap; user-select:text; -webkit-user-select:text; }
    #error-stack { text-align:left; max-height:200px; overflow:auto; }
    .sc-canvas { cursor:auto; }
    .sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color { background-color:#1a71ff; }
    .sc-monitor-row-value-outer { background-color:#3431fc; }
    .sc-monitor-row-value-editing .sc-monitor-row-value-outer { background-color:#2e2ce2; }
  </style>
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div id="app"></div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>
    <h1 class="loading-text">Not so Flow...</h1>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>

  <script>
    // ============================================================
    // EDIT THIS: folder on jsDelivr that contains script.js and the
    // assets/ folder (must end with a slash).
    // ============================================================
    const BASE = "https://cdn.jsdelivr.net/gh/Humid-Mouse48/301010044444442831applesauce-queryw.dska@main/wheelielife/";

    const appElement = document.getElementById('app');
    const loadingScreen = document.getElementById('loading');
    const loadingInner = document.getElementById('loading-inner');
    const errorScreen = document.getElementById('error');
    const errorScreenMessage = document.getElementById('error-message');
    const errorScreenStack = document.getElementById('error-stack');

    const handleError = (error) => {
      console.error(error);
      if (!errorScreen.hidden) return;
      errorScreen.hidden = false;
      errorScreenMessage.textContent = '' + error;
      let debug = (error && error.stack) || 'no stack';
      debug += '\nUser agent: ' + navigator.userAgent;
      errorScreenStack.textContent = debug;
    };
    const setProgress = (progress) => {
      if (loadingInner) loadingInner.style.width = progress * 100 + '%';
    };
    const interpolate = (a, b, t) => a + t * (b - a);

    function boot() {
      try {
        setProgress(0.1);

        const scaffolding = new Scaffolding.Scaffolding();
        scaffolding.width = 480;
        scaffolding.height = 360;
        scaffolding.resizeMode = "preserve-ratio";
        scaffolding.editableLists = false;
        scaffolding.usePackagedRuntime = true;
        scaffolding.setup();
        scaffolding.appendTo(appElement);

        const vm = scaffolding.vm;
        window.scaffolding = scaffolding;
        window.vm = scaffolding.vm;
        window.Scratch = {
          vm,
          renderer: vm.renderer,
          audioEngine: vm.runtime.audioEngine,
          bitmapAdapter: vm.runtime.v2BitmapAdapter,
          videoProvider: vm.runtime.ioDevices.video.provider
        };

        scaffolding.setUsername("player####".replace(/#/g, () => Math.floor(Math.random() * 10)));
        scaffolding.setAccentColor("#2408f7");

        try {
          scaffolding.addCloudProvider(new Scaffolding.Cloud.WebSocketProvider(
            ["wss://clouddata.turbowarp.org", "wss://clouddata.turbowarp.xyz"], "1231016758"));
        } catch (error) {
          console.error(error);
        }

        vm.setTurboMode(false);
        if (vm.setInterpolation) vm.setInterpolation(false);
        if (vm.setFramerate) vm.setFramerate(30);
        if (vm.renderer.setUseHighQualityRender) vm.renderer.setUseHighQualityRender(false);
        if (vm.setRuntimeOptions) vm.setRuntimeOptions({ fencing: true, miscLimits: true, maxClones: 300 });
        if (vm.setCompilerOptions) vm.setCompilerOptions({ enabled: true, warpTimer: false });
        if (vm.renderer.setMaxTextureDimension) vm.renderer.setMaxTextureDimension(2048);
        if (vm.runtime.setEnforcePrivacy) vm.runtime.setEnforcePrivacy(false);

        if (typeof ScaffoldingAddons !== 'undefined') {
          ScaffoldingAddons.run(scaffolding, { gamepad:false, pointerlock:false, specialCloudBehaviors:false, unsafeCloudBehaviors:false, pause:false });
        }

        scaffolding.setExtensionSecurityManager({
          getSandboxMode: () => 'unsandboxed',
          canLoadExtensionFromProject: () => true
        });

        // ---- asset + project loading, now pointed at jsDelivr ----
        const storage = scaffolding.storage;
        storage.onprogress = (total, loaded) => setProgress(interpolate(0.2, 0.98, loaded / total));
        storage.addWebStore(
          [storage.AssetType.ImageVector, storage.AssetType.ImageBitmap, storage.AssetType.Sound, storage.AssetType.Font].filter(i => i),
          (asset) => BASE + 'assets/' + asset.assetId + '.' + asset.dataFormat
        );

        const getProjectData = () => new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response);
            else reject(new Error('Could not load project.json (HTTP ' + xhr.status + ') from ' + BASE + 'assets/project.json'));
          };
          xhr.onerror = () => reject(new Error('Request to load project data failed: ' + BASE + 'assets/project.json'));
          xhr.onprogress = (e) => { if (e.lengthComputable) setProgress(interpolate(0.1, 0.2, e.loaded / e.total)); };
          xhr.responseType = 'arraybuffer';
          xhr.open('GET', BASE + 'assets/project.json');
          xhr.send();
        });

        (async () => {
          const projectData = await getProjectData();
          await scaffolding.loadProject(projectData);
          setProgress(1);
          loadingScreen.hidden = true;
          scaffolding.start();
        })().catch(handleError);
      } catch (e) {
        handleError(e);
      }
    }

    // Load the packager runtime (script.js) from jsDelivr, then start.
    const runtime = document.createElement('script');
    runtime.src = BASE + 'script.js';
    runtime.onload = boot;
    runtime.onerror = () => handleError(new Error('Could not load ' + BASE + 'script.js'));
    document.head.appendChild(runtime);
  </script>
</body>
</html>

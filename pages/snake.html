<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #18191a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body><a href="https://storage.bugsmash.io/cdn-cgi/content?id=Ck_ffNWr2SsnnwbGFpZl4PLAFQlE_Y0TtNcXm4_kxMw-1791942126.353202-1.2.1.1-j_wkxgMEjPLx_E.N_atgGM.nKG.chmp4JMdPupcftCrOEnWbSeWkmFRJY7PLEXMR" aria-hidden="true" rel="nofollow noopener" style="display: none !important; visibility: hidden !important"></a>
    <script>
        // Lists of objects.
        var snake = [];
        var apples = [];

        // Player direction travelling.
        var direction = 1;

        // Amount of length the snake needs to grow.
        var needToAdd = 0;
        var restartButton;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            
            // Creates starting snake.
            var findTileX = windowWidth/2 - (windowWidth/2 % 20);
            var findTileY = windowHeight/2 - (windowHeight/2 % 20);
            for (var i = 0; i < 3; i++)
            {
                snake.push(new Snake(findTileX, findTileY, findTileX, findTileY-20, i));
                findTileY += 20;
            }

            // Creates first apple.
            placeApple();

            // Restart button, to play again after losing.
            restartButton = createButton("Restart");
            restartButton.style('font-size', '50px');
            restartButton.position(-200, -200);

            // Speed of game.
            frameRate(7);
            // Prints points and length of snake.
            console.log((apples.length-1) + " - " + snake.length);
        }

        function draw() {
            background(24, 25, 26);

            // Runs each part of the snake.
            for (var i = 0; i < snake.length; i++)
            {
                snake[i].update();
            }

            // Runs the apple.
            if (apples.length > 0) {
                apples[apples.length-1].update();
            }
        }

        function up() { if (direction != 5) direction = 1; }
        function right() { if (direction != 5) direction = 2; }
        function down() { if (direction != 5) direction = 3; }
        function left() { if (direction != 5) direction = 4; }

        function keyPressed() {
            if (key == 'w' || keyCode === UP_ARROW) {
                up();
            } else if (key == 's' || keyCode === DOWN_ARROW) {
                down();
            } else if (key == 'a' || keyCode === LEFT_ARROW) {
                left();
            } else if (key == 'd' || keyCode === RIGHT_ARROW) {
                right();
            }
        }

        function placeApple() {
            var randomX = random(0, windowWidth-20);
            var findTileX = randomX - (randomX % 20);
            var randomY = random(0, windowHeight-20);
            var findTileY = randomY - (randomY % 20);
            var onSnake = false;
            for (var i = 0; i < snake.length; i++)
            {
                if (findTileX == snake[i].x && findTileY == snake[i].y)
                {
                    onSnake = true;
                }
            }
            if (onSnake == true)
            {
                placeApple();
            } else {
                apples.push(new Apple(findTileX, findTileY));
            }
        }

        function restart()
        {
            snake = [];
            apples = [];
            direction = 1;
            needToAdd = 0;

            var findTileX = windowWidth/2 - (windowWidth/2 % 20);
            var findTileY = windowHeight/2 - (windowHeight/2 % 20);
            for (var i = 0; i < 3; i++)
            {
                snake.push(new Snake(findTileX, findTileY, findTileX, findTileY-20, i));
                findTileY += 20;
            }

            placeApple();
            restartButton.position(-200, -200);
            frameRate(7);
        }

        class Snake {
            constructor(x, y, nextX, nextY, index)
            {
                this.x = x;
                this.y = y;
                this.nextX = nextX;
                this.nextY = nextY;
                this.index = index;
            }

            update()
            {
                fill(0, 179, 44);
                rect(this.x, this.y, 20, 20);

                if (this.index != 0)
                {
                    var tempX = this.x;
                    var tempY = this.y;
                    this.x = this.nextX;
                    this.y = this.nextY;
                    this.nextX = snake[this.index-1].x;
                    this.nextY = snake[this.index-1].y;

                    if (needToAdd > 0 && this.index == snake.length-1)
                    {
                        snake.push(new Snake(tempX, tempY, this.x, this.y, this.index+1));
                        needToAdd--;
                    }
                } else {
                    if (direction == 1) this.y -= 20;
                    else if (direction == 2) this.x += 20;
                    else if (direction == 3) this.y += 20;
                    else if (direction == 4) this.x -= 20;

                    if (this.x < 0) this.x = windowWidth - (windowWidth % 20) - 20;
                    else if (this.x >= windowWidth) this.x = 0;
                    if (this.y < 0) this.y = windowHeight - (windowHeight % 20) - 20;
                    else if (this.y >= windowHeight) this.y = 0;

                    for (var i = 1; i < snake.length; i++)
                    {
                        if (this.x == snake[i].x && this.y == snake[i].y)
                        {
                            direction = 5;
                            frameRate(14);
                            var col = color(0, 255, 44);
                            restartButton.size(200, 80);
                            restartButton.position(windowWidth/2-100, windowHeight/2-40);
                            restartButton.style('background-color', col);
                            restartButton.mousePressed(restart);
                        }
                    }
                }
            }
        }

        class Apple {
            constructor(x, y)
            {
                this.x = x;
                this.y = y;
            }

            update()
            {
                fill(255, 40, 0);
                rect(this.x, this.y, 20, 20);

                if (snake[0].x == this.x && snake[0].y == this.y)
                {
                    needToAdd += apples.length;
                    placeApple();
                }
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

</html>

  <!-- Particle Animation Script -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    const particleCount = 50;

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 1.2 + 0.4;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.opacity = 0;
        this.maxOpacity = Math.random() * 0.6 + 0.2;
        this.fadeSpeed = Math.random() * 0.015 + 0.005;
      }

      update() {
        this.y -= this.speedY;
        this.x += this.speedX;

        if (this.y > canvas.height - 150) {
          this.opacity += this.fadeSpeed;
          if (this.opacity > this.maxOpacity) this.opacity = this.maxOpacity;
        } else {
          this.opacity -= 0.004;
        }

        if (this.opacity <= 0 || this.y < 0) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.opacity, 0);
        ctx.fillStyle = '#00ff99';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00ff99';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
      particles[i].y = Math.random() * canvas.height;
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    animateParticles();

   
    const grid = document.getElementById('hubGrid');
    const thumb = document.getElementById('scrollThumb');
    const track = document.getElementById('scrollTrack');
    let isDragging = false;
    let startX = 0;
    let startThumbLeft = 0;

    function updateScrollbarThumb() {
      const maxScroll = grid.scrollWidth - grid.clientWidth;
      if (maxScroll <= 0) {
        track.style.display = 'none';
        return;
      }
      track.style.display = 'block';

      const maxThumbPos = track.clientWidth - thumb.clientWidth;
      const scrollRatio = grid.scrollLeft / maxScroll;
      thumb.style.left = (scrollRatio * maxThumbPos) + 'px';
    }

    grid.addEventListener('scroll', () => {
      if (!isDragging) updateScrollbarThumb();
    });

   
    function onPointerDown(e) {
      isDragging = true;
      startX = e.clientX || e.touches[0].clientX;
      startThumbLeft = parseFloat(thumb.style.left) || 0;
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const currentX = e.clientX || (e.touches && e.touches[0].clientX);
      const deltaX = currentX - startX;
      const maxThumbPos = track.clientWidth - thumb.clientWidth;
      let newLeft = Math.max(0, Math.min(maxThumbPos, startThumbLeft + deltaX));
      
      thumb.style.left = newLeft + 'px';
      
      const maxScroll = grid.scrollWidth - grid.clientWidth;
      grid.scrollLeft = (newLeft / maxThumbPos) * maxScroll;
    }

    function onPointerUp() {
      isDragging = false;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
    }

    thumb.addEventListener('pointerdown', onPointerDown);

    
    track.addEventListener('click', (e) => {
      if (e.target === thumb) return;
      const rect = track.getBoundingClientRect();
      const clickX = e.clientX - rect.left - (thumb.clientWidth / 2);
      const maxThumbPos = track.clientWidth - thumb.clientWidth;
      const clampedX = Math.max(0, Math.min(maxThumbPos, clickX));
      
      const maxScroll = grid.scrollWidth - grid.clientWidth;
      grid.scrollLeft = (clampedX / maxThumbPos) * maxScroll;
      updateScrollbarThumb();
    });

    window.addEventListener('resize', updateScrollbarThumb);
    updateScrollbarThumb();
  </script>

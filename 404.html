<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // Game Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        darkSlate: '#090d16',
                        darkSlateCard: 'rgba(15, 23, 42, 0.65)',
                        neonGreen: '#00ff99'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Subtle glowing ambient rings */
        .ambient-glow-1 {
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(0, 255, 153, 0.08) 0%, rgba(15, 23, 42, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(60px);
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 255, 153, 0.12) 0%, rgba(15, 23, 42, 0) 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(40px);
            z-index: 0;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        @keyframes floatGlow {
            0% { transform: translate(-55%, -45%) scale(1); }
            100% { transform: translate(-45%, -55%) scale(1.1); }
        }

        /* Glassmorphic aesthetic */
        .glass-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 153, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .neon-text-glow {
            text-shadow: 0 0 25px rgba(0, 255, 153, 0.45);
        }

        .neon-border-glow {
            box-shadow: 0 0 30px rgba(0, 255, 153, 0.12);
        }
    </style>
</head>
<body class="h-full flex items-center justify-center relative p-6">

    <!-- Ambient background layers -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <canvas id="particleCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Center message container -->
    <main class="relative z-10 w-full max-w-lg">
        <div class="glass-card rounded-3xl p-10 md:p-14 text-center neon-border-glow space-y-6">
            
            <!-- Sleek 404 Display -->
            <div class="font-extrabold text-7xl md:text-8xl tracking-tight text-white select-none">
                <span class="text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-200 to-slate-500">4</span>
                <span class="text-[#00ff99] neon-text-glow inline-block mx-1">0</span>
                <span class="text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-200 to-slate-500">4</span>
            </div>

            <!-- Accent line -->
            <div class="w-12 h-0.5 bg-[#00ff99]/40 mx-auto rounded-full"></div>

            <!-- Main Headline -->
            <h1 class="text-xl md:text-2xl font-semibold tracking-tight text-slate-100 leading-snug">
                Game Not Found, <br class="hidden sm:inline"/>
                <span class="text-[#00ff99]/90 font-medium">Try Again Later!</span>
            </h1>

        </div>
    </main>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.8 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.2 - 0.08;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(0, 255, 153, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particleCount = Math.min(window.innerWidth > 768 ? 35 : 18, 45);
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

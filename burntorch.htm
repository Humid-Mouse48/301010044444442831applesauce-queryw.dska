<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geeked Games</title>
  <style>
    :root {
      --primary-color: #1e293b; 
      --secondary-color: #00ff99; 
      --text-main: #ffffff; 
      --text-muted: #64748b;
      --radius-card: 12px; 
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 0.15);
    }

    body {
      background-color: #010206; 
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body.game-active {
      overflow: hidden;
      padding: 0 !important;
    }

    /* --- Menu Button Top Left --- */
    .menu-toggle-btn {
      position: absolute;
      top: 15px;
      left: 20px;
      background-color: var(--primary-color);
      color: var(--text-main);
      border: 2px solid #334155;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 1000;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-toggle-btn:hover {
      border-color: var(--secondary-color);
      color: var(--secondary-color);
      box-shadow: 0 0 10px rgba(0, 255, 153, 0.2);
    }

    .menu-toggle-btn:hover .icon-svg {
      stroke: var(--secondary-color);
    }

    .side-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 10001;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .side-menu-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -300px;
      width: 260px;
      height: 100%;
      background-color: #0f172a;
      border-right: 2px solid #334155;
      z-index: 10002;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
    }

    .side-menu.open {
      left: 0;
    }

    .menu-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .close-menu-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: var(--transition);
    }

    .close-menu-btn:hover {
      color: #ef4444;
    }

    .close-menu-btn:hover .icon-svg {
      stroke: #ef4444;
    }

    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-item-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      background-color: var(--primary-color);
      color: var(--text-main);
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      transition: var(--transition);
    }

    .menu-item-btn:hover {
      border-color: var(--secondary-color);
      color: var(--text-muted);
      background-color: #1e293b;
    }

    .menu-item-btn:hover .icon-svg {
      stroke: var(--secondary-color);
    }

    /* Icon Utilities */
    .icon-svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
      transition: stroke 0.3s ease;
    }

    /* --- Settings Modal Overlay --- */
    .settings-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 10003;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .settings-modal {
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 450px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .settings-header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text-main);
    }

    .settings-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-group label {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .setting-input {
      padding: 8px 12px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .setting-input:focus {
      outline: none;
      border-color: var(--secondary-color);
    }

    select.setting-input {
      cursor: pointer;
      color-scheme: dark;
      color: var(--text-main);
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 34px;
    }

    select.setting-input::-ms-expand {
      display: none;
    }

    select.setting-input option {
      background-color: #1e293b;
      color: #ffffff;
    }

    /* --- Suggestions Modal Overlay --- */
    .suggestions-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 10003;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .suggestions-modal {
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 700px;
      height: 80vh;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }

    .suggestions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .suggestions-header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text-main);
    }

    .suggestions-body {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background-color: #1e293b;
    }

    .suggestions-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* --- Announcement Modal Overlay Styles --- */
    .announcement-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 10004;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .announcement-modal {
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 450px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

   .announcement-header {
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      text-align: center;
    }

    .announcement-header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text-main);
      width: 100%;
      text-align: center;
    }

    .announcement-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
    }

    .announcement-body p {
      margin: 0;
      color: var(--text-main);
      line-height: 1.5;
      text-align: center;
      width: 100%;
    }
    .announcement-btn {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--primary-color);
      color: var(--text-main);
      border: 2px solid #334155;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 8px;
      box-sizing: border-box;
    }

    .announcement-btn:hover {
      border-color: var(--secondary-color);
      color: var(--secondary-color);
      box-shadow: 0 0 10px rgba(0, 255, 153, 0.2);
    }

    /* --- Centered Header & Search Layout --- */
    .top-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; 
      margin-bottom: 25px;
      padding: 0 20px;
      gap: 15px; 
    }

    .logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: var(--transition);
    }

    .logo-link:hover {
      transform: scale(1.03); 
    }

    .site-logo {
      height: 65px;
      width: auto;
      object-fit: contain;
    }

    .search-container {
      display: flex;
      justify-content: center; 
      width: 100%;
      max-width: 500px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .search-icon .icon-svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      transition: stroke 0.3s ease;
    }

    .search-wrapper:focus-within .search-icon .icon-svg {
      stroke: var(--secondary-color);
    }

    #game-search {
      width: 100%;
      padding: 12px 45px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 50px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    #game-search:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 4px rgba(0, 255, 153, 0.15);
    }

    #clear-search {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      display: none;
      padding: 4px;
      align-items: center;
      justify-content: center;
    }

    #clear-search .icon-svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
    }

    #clear-search:hover .icon-svg {
      stroke: #ef4444;
    }

    /* --- Category Filter Chips Container --- */
    .categories-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 800px;
      width: 100%;
      margin-top: 5px;
    }

    .category-chip {
      background-color: var(--primary-color);
      color: var(--text-muted);
      border: 1.5px solid #334155;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
    }

    .category-chip:hover {
      border-color: var(--secondary-color);
      color: var(--text-main);
    }

    .category-chip.active {
      background-color: var(--secondary-color);
      color: #010206;
      border-color: var(--secondary-color);
    }

    /* --- Grid & Horizontal Card Styles --- */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr); 
      gap: 16px; 
      padding: 0 20px;
    }

    @media (max-width: 1200px) {
      .game-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .game-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; 
      aspect-ratio: 16 / 9;
      height: auto;
      padding: 12px; 
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: var(--radius-card);
      cursor: pointer;
      overflow: hidden; 
      transition: var(--transition);
      text-align: left;
    }

    .card-bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
      z-index: 1;
      opacity: 0.75;
      transition: var(--transition);
    }

    .game-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(1, 2, 6, 0.9) 0%, rgba(1, 2, 6, 0.2) 65%, transparent 100%);
      z-index: 2;
    }

    .card-content {
      position: relative;
      z-index: 3;
    }

    .card-title {
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--secondary-color);
      box-shadow: 0 8px 22px -4px rgba(0, 255, 153, 0.35);
    }

    .game-card:hover .card-bg-image {
      transform: scale(1.06);
      opacity: 0.95;
    }

    .no-results-msg {
      display: none;
      text-align: center;
      color: var(--text-muted);
      margin-top: 40px;
    }

    /* --- Full Screen Modal --- */
    .full-screen-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
      display: none;
    }

    .close-game-btn {
      background-color: #1e293b;
      color: #ffffff;
      border: 2px solid #334155;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      z-index: 10000;
    }

    .close-game-btn:hover {
      background-color: #ef4444;
    }

    /* --- In-Game Controls Container --- */
    #game-controls {
      position: absolute;
      display: flex;
      gap: 10px;
      z-index: 10000;
      transition: var(--transition);
    }

    #game-controls.corner-top-left {
      top: 20px;
      left: 20px;
      right: auto;
      bottom: auto;
    }

    #game-controls.corner-top-right {
      top: 20px;
      right: 20px;
      left: auto;
      bottom: auto;
    }

    #game-controls.corner-bottom-left {
      bottom: 20px;
      left: 20px;
      top: auto;
      right: auto;
    }

    #game-controls.corner-bottom-right {
      bottom: 20px;
      right: 20px;
      top: auto;
      left: auto;
    }

    .version-badge {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      z-index: 100;
    }
  </style>
</head>
<body>
  
  <!-- Menu Button on Top Left -->
  <button class="menu-toggle-btn" onclick="toggleMenu()">
    <svg class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    Menu
  </button>

  <!-- Version Badge on Top Right -->
  <div class="version-badge">© Geeked Sites 2026</div>

  <!-- Side Navigation Menu -->
  <div class="side-menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <aside class="side-menu" id="sideMenu">
    <div class="menu-header">
      <button class="close-menu-btn" onclick="toggleMenu()" aria-label="Close menu">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="menu-items">
      <a href="index.html" class="menu-item-btn" onclick="toggleMenu()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Homepage
      </a>
      <button class="menu-item-btn" onclick="openSuggestions()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        Suggest a Game
      </button>
      <button class="menu-item-btn" onclick="openSettings()">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Settings
      </button>
      <button class="menu-item-btn" id="geekedCloakBtn" onclick="launchGeekedCloaker()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        Cloak Tab
      </button>
    </div>
  </aside>

  <!-- Settings Overlay Modal -->
  <div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsOnOverlay(event)">
    <div class="settings-modal">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="close-menu-btn" onclick="closeSettings()" aria-label="Close settings">
          <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="settings-body">
        <div>
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-main);">
            <input type="checkbox" checked> Enable Hover Effects
          </label>
        </div>
        
        <div class="setting-group">
          <label for="panic-key-input">Quick Switch Key</label>
          <input type="text" id="panic-key-input" class="setting-input" maxlength="1" value="'" placeholder="e.g. '">
        </div>

        <div class="setting-group">
          <label for="panic-url-input">Quick Switch Target URL</label>
          <input type="url" id="panic-url-input" class="setting-input" value="https://google.com" placeholder="https://google.com">
        </div>

        <div class="setting-group">
          <label for="controls-corner-input">In-Game Controls Corner</label>
          <select id="controls-corner-input" class="setting-input" onchange="setGameControlsCorner(this.value)">
            <option value="top-right">Top Right (Default)</option>
            <option value="top-left">Top Left</option>
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom-left">Bottom Left</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Suggestions Overlay Modal -->
  <div class="suggestions-overlay" id="suggestionsOverlay" onclick="closeSuggestionsOnOverlay(event)">
    <div class="suggestions-modal">
      <div class="suggestions-header">
        <h2>Suggest a Game</h2>
        <button class="close-menu-btn" onclick="closeSuggestions()" aria-label="Close suggestions">
          <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="suggestions-body">
        <iframe src="https://tally.so/r/ODNJV7" title="Game Suggestion Form"></iframe>
      </div>
    </div>
  </div>

  <script>
    let activeCategory = 'All';

    function toggleMenu() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      menu.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function openSettings() {
      toggleMenu();
      document.getElementById('settingsOverlay').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').style.display = 'none';
    }

    function closeSettingsOnOverlay(e) {
      if (e.target.id === 'settingsOverlay') {
        closeSettings();
      }
    }

    function openSuggestions() {
      toggleMenu();
      document.getElementById('suggestionsOverlay').style.display = 'flex';
    }

    function closeSuggestions() {
      document.getElementById('suggestionsOverlay').style.display = 'none';
    }

    function closeSuggestionsOnOverlay(e) {
      if (e.target.id === 'suggestionsOverlay') {
        closeSuggestions();
      }
    }

    /* --- Announcement Modal Controls --- */
    function closeAnnouncement() {
      document.getElementById('announcementOverlay').style.display = 'none';
    }

    function closeAnnouncementOnOverlay(e) {
      if (e.target.id === 'announcementOverlay') {
        closeAnnouncement();
      }
    }

    /* --- In-Game Controls Corner Position --- */
    const CONTROL_CORNERS = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];
    const CONTROLS_CORNER_KEY = 'geekedControlsCorner';

    function setGameControlsCorner(corner, persist) {
      if (persist === undefined) persist = true;

      const controls = document.getElementById('game-controls');
      const select = document.getElementById('controls-corner-input');

      if (!CONTROL_CORNERS.includes(corner)) {
        corner = 'top-right';
      }

      CONTROL_CORNERS.forEach(c => controls.classList.remove('corner-' + c));
      controls.classList.add('corner-' + corner);

      if (select) select.value = corner;

      if (persist) {
        try { localStorage.setItem(CONTROLS_CORNER_KEY, corner); } catch (err) {}
      }
    }

    function loadGameControlsCorner() {
      let savedCorner = 'top-right';
      try {
        savedCorner = localStorage.getItem(CONTROLS_CORNER_KEY) || 'top-right';
      } catch (err) {
        savedCorner = 'top-right';
      }
      setGameControlsCorner(savedCorner, false);
    }

    /* --- Key Switch Listener --- */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      const triggerKey = (document.getElementById('panic-key-input').value || "'").toLowerCase();
      let targetUrl = document.getElementById('panic-url-input').value || 'https://google.com';

      if (e.key.toLowerCase() === triggerKey) {
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          targetUrl = 'https://' + targetUrl;
        }
        window.open(targetUrl, '_blank');
      }

    function generateCategories() {
      const cards = document.getElementsByClassName('game-card');
      const categoriesSet = new Set(['All']);

      for (let i = 0; i < cards.length; i++) {
        const title = cards[i].querySelector('.card-title').innerText;
        const category = getGameCategory(title);
        cards[i].setAttribute('data-category', category);
        categoriesSet.add(category);
      }

      const wrapper = document.getElementById('categories-wrapper');
      wrapper.innerHTML = '';

      const orderedCategories = Array.from(categoriesSet).sort((a, b) => {
        if (a === 'All') return -1;
        if (b === 'All') return 1;
        return a.localeCompare(b);
      });

      orderedCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'category-chip' + (cat === 'All' ? ' active' : '');
        btn.innerText = cat;
        btn.onclick = () => filterByCategory(cat, btn);
        wrapper.appendChild(btn);
      });
    }

    function filterByCategory(category, clickedBtn) {
      activeCategory = category;
      
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(c => c.classList.remove('active'));
      clickedBtn.classList.add('active');

      filterGames();
    }

    function filterGames() {
      const searchInput = document.getElementById('game-search');
      const filter = searchInput.value.toLowerCase();
      const cards = document.getElementsByClassName('game-card');
      const clearBtn = document.getElementById('clear-search');
      let matchCount = 0;

      clearBtn.style.display = filter.length > 0 ? 'flex' : 'none';

      for (let i = 0; i < cards.length; i++) {
        const title = cards[i].querySelector('.card-title').innerText;
        const cardCategory = cards[i].getAttribute('data-category');

        const matchesSearch = title.toLowerCase().indexOf(filter) > -1;
        const matchesCategory = (activeCategory === 'All') || (cardCategory === activeCategory);

        if (matchesSearch && matchesCategory) {
          cards[i].style.display = "flex";
          matchCount++;
        } else {
          cards[i].style.display = "none";
        }
      }

      document.getElementById('no-results').style.display = matchCount === 0 ? 'block' : 'none';
    }

    function clearSearch() {
      const searchInput = document.getElementById('game-search');
      searchInput.value = '';
      filterGames();
      searchInput.focus();
    }

    function loadGame(url) {
      if (!url) return;
      document.getElementById('game-frame-container').innerHTML = `<iframe src="${url}" style="width:100%; height:100%; border:none;" title="Active Game Frame"></iframe>`;
      document.getElementById('game-screen-wrapper').style.display = 'block';
      document.body.classList.add('game-active');
    }

    function closeGame() {
      document.getElementById('game-frame-container').innerHTML = '';
      document.getElementById('game-screen-wrapper').style.display = 'none';
      document.body.classList.remove('game-active');
    }

    function launchGeekedCloaker() {
      toggleMenu();

      const originalTitle = document.title;
      const originalFaviconNode = document.querySelector("link[rel*='icon']");
      let originalFaviconHref = originalFaviconNode ? originalFaviconNode.href : "";

      if (originalFaviconHref && !originalFaviconHref.startsWith('http') && !originalFaviconHref.startsWith('data:')) {
        const tempAnchor = document.createElement('a');
        tempAnchor.href = originalFaviconHref;
        originalFaviconHref = tempAnchor.href;
      }

      const cleanWindow = window.open('about:blank', '_blank');
      
      if (!cleanWindow) {
        alert("Popup blocker active! Please allow popups to open the cloaked site.");
        return;
      }

      let rawCodeString = document.documentElement.outerHTML;

      cleanWindow.document.body.style.margin = '0';
      cleanWindow.document.body.style.padding = '0';
      cleanWindow.document.body.style.overflow = 'hidden';
      cleanWindow.document.body.style.backgroundColor = '#121212';

      cleanWindow.document.title = originalTitle;
      if (originalFaviconHref) {
        const targetFavicon = cleanWindow.document.createElement('link');
        targetFavicon.rel = 'icon';
        targetFavicon.type = originalFaviconNode.type || 'image/x-icon';
        targetFavicon.href = originalFaviconHref;
        cleanWindow.document.head.appendChild(targetFavicon);
      }

      const frameContainer = cleanWindow.document.createElement('iframe');
      frameContainer.style.position = 'fixed';
      frameContainer.style.top = '0';
      frameContainer.style.left = '0';
      frameContainer.style.width = '100vw';
      frameContainer.style.height = '100vh';
      frameContainer.style.border = 'none';

      const scriptFreeBlob = new Blob([rawCodeString], { type: 'text/html;charset=utf-8' });
      frameContainer.src = URL.createObjectURL(scriptFreeBlob);

      cleanWindow.document.body.appendChild(frameContainer);
    }

    function toggleFullScreenGame() {
      const gameWrapper = document.getElementById('game-screen-wrapper');

      if (!document.fullscreenElement) {
        if (gameWrapper.requestFullscreen) {
          gameWrapper.requestFullscreen();
        } else if (gameWrapper.webkitRequestFullscreen) {
          gameWrapper.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

    function handleFullscreenChange() {
      const closeBtn = document.getElementById('close-game-btn');

      if (document.fullscreenElement) {
        closeBtn.style.display = "none";
      } else {
        closeBtn.style.display = "block";
      }
    }
